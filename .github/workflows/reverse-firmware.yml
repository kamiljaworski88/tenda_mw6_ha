name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3

      - name: Resolve GetHostList call targets
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
          bin='firmware-src/RootFS-unpacked/bin/confsrv'
          out='docs/reverse-generated/run134-gethostlist-got-callmap.txt'

          python3 - "$bin" "$out" <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          binary=Path(sys.argv[1]); out=Path(sys.argv[2])

          def run(cmd):
              return subprocess.run(cmd, text=True, errors='replace',
                                    stdout=subprocess.PIPE, stderr=subprocess.STDOUT).stdout

          dis=run(["mipsel-linux-gnu-objdump","-drwC",
                   "--start-address=0x434f9c","--stop-address=0x435424",str(binary)])
          attrs=run(["mipsel-linux-gnu-readelf","-A",str(binary)])
          syms=run(["mipsel-linux-gnu-readelf","-Ws",str(binary)])
          rels=run(["mipsel-linux-gnu-readelf","-r",str(binary)])

          # confctl_get_host_list prologue:
          # gp = t9 + 0x621c4; t9 is the function address 0x434f9c.
          gp=0x434f9c+0x621c4

          # Parse readelf -A MIPS GOT global table. Typical lines contain:
          # Address ... Sym.Val. Type Ndx Name
          got_by_addr={}
          for line in attrs.splitlines():
              m=re.match(r'^\s*(0x[0-9a-fA-F]+)\s+.*?\s([A-Za-z_][A-Za-z0-9_@.]*)(?:\s*)$',line)
              if m:
                  got_by_addr[int(m.group(1),16)]=m.group(2)

          # More robust symbol-name recovery: for every computed GOT address, search
          # the readelf -A line containing that address and keep the final token.
          lines=dis.splitlines()
          calls=[]
          for i,l in enumerate(lines):
              m=re.search(r'\blw\s+([a-z0-9]+),(-?\d+)\(gp\)',l)
              if not m:
                  continue
              reg=m.group(1); off=int(m.group(2))
              # Only treat it as a function pointer when a jalr of that same register
              # appears in the next handful of instructions.
              window=lines[i+1:i+8]
              if not any(re.search(rf'\bjalr\s+{re.escape(reg)}\b',x) for x in window):
                  continue
              addr=(gp+off)&0xffffffff
              symbol=None
              addr_forms={f"0x{addr:08x}",f"{addr:08x}"}
              for a in attrs.splitlines():
                  if any(x.lower() in a.lower() for x in addr_forms):
                      toks=a.split()
                      if toks:
                          symbol=toks[-1]
                          if symbol in ("UNDEF","UND","LOCAL","GLOBAL","DEFAULT"):
                              symbol=None
                      if symbol:
                          break
              calls.append((i,l,reg,off,addr,symbol,window))

          with out.open("w",encoding="utf-8") as o:
              o.write("===== RUN 134: confctl_get_host_list GOT call map =====\n")
              o.write(f"Computed gp = 0x{gp:08x}\n")
              o.write("Function range: 0x434f9c..0x435420\n\n")

              o.write("===== RESOLVED INDIRECT CALLS IN EXECUTION ORDER =====\n")
              for n,(i,l,reg,off,addr,sym,window) in enumerate(calls,1):
                  o.write(f"\n[{n}] GOT {off:+d}(gp) => 0x{addr:08x} => {sym or 'UNRESOLVED'}\n")
                  o.write(l+"\n")
                  o.write("\n".join(window)+"\n")

              o.write("\n===== TARGETED KNOWN OFFSETS =====\n")
              for off in (-31956,-31216,-30976,-30912,-32192,-30416,-30460,-31212,-30584,-30768):
                  addr=(gp+off)&0xffffffff
                  hits=[a for a in attrs.splitlines() if f"{addr:08x}" in a.lower() or f"0x{addr:08x}" in a.lower()]
                  o.write(f"{off:+d}(gp) -> 0x{addr:08x}\n")
                  for h in hits:
                      o.write("  "+h+"\n")

              o.write("\n===== GET HOST LIST DISASSEMBLY =====\n")
              o.write(dis)
              o.write("\n===== MIPS ABI / GOT TABLE =====\n")
              o.write(attrs)
              o.write("\n===== DYNAMIC SYMBOLS FILTERED =====\n")
              for l in syms.splitlines():
                  if re.search(r'host|statistic|netlink|feature|pack|malloc|free|sleep|usleep|rate|client|online|assoc|signal',l,re.I):
                      o.write(l+"\n")
              o.write("\n===== RELOCATIONS =====\n")
              o.write(rels)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: run134-gethostlist-got-callmap
          path: docs/reverse-generated/run134-gethostlist-got-callmap.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run134-gethostlist-got-callmap.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: resolve GetHostList call targets'
            git push
          fi
