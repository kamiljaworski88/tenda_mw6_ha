name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3
      - name: Resolve exact HostInfo rate semantics
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          conf='firmware-src/RootFS-unpacked/bin/confsrv'
          pb='firmware-src/RootFS-unpacked/lib/libpb.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/rate-semantics.txt'
          mipsel-linux-gnu-objdump -drwC "$conf" > /tmp/conf.asm
          mipsel-linux-gnu-readelf -sW "$conf" > /tmp/conf.syms
          mipsel-linux-gnu-readelf -sW "$pb" > /tmp/pb.syms
          {
            echo '===== RUN 35 GOAL ====='
            echo 'Resolve exact DL/UL field mapping, units, rate write path, and HostInfo protobuf field numbers.'
            echo '===== RATE WRITE WINDOW ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x4346f0 --stop-address=0x434970 "$conf" || true
            echo '===== ALL GOT SYMBOLS USED BY RATE WINDOW ====='
            grep -E '(-31888|-31884|-31880|-31876|-31872|-30768|-30584|-31408|-31216|-31212)\(gp\)' /tmp/conf.asm | head -n 300 || true
            echo '===== DYNAMIC SYMBOL TABLE RELEVANT NAMES ====='
            grep -iE 'netlink|g_ip_info|time|sleep|usleep|div|inet|ethaddr|strcmp|host|rate|stat' /tmp/conf.syms || true
            echo '===== HOSTINFO PROTOBUF SYMBOLS ====='
            grep -iE 'host_info|host_lists' /tmp/pb.syms || true
            echo '===== HOSTINFO DESCRIPTOR/STRINGS ====='
            strings -a -t x "$pb" | grep -iE -B6 -A12 'HostInfo|HostLists|uprate|downrate|signal|assoc_sn|condtion_time|interface_name|host_name' || true
            echo '===== PROTOBUF DESCRIPTOR WINDOW ====='
            mipsel-linux-gnu-objdump -s -j .rodata "$pb" | grep -n -B20 -A80 -iE 'uprate|downrate' || true
            echo '===== RATE DEBUG STRINGS IN CONFSRV ====='
            strings -a -t x "$conf" | grep -iE -B12 -A20 'uprate|downrate|up rate|down rate|rate.*%|online_ip' || true
            echo '===== FEATURE 14/15 GATES INSIDE GETHOSTLIST/RATE ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x434300 --stop-address=0x435300 "$conf" | grep -E -B5 -A8 'li[[:space:]]+a0,(14|15)' || true
          } > "$out"
          head -c 1400000 "$out" > /tmp/cut && mv /tmp/cut "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: rate-semantics
          path: docs/reverse-generated/rate-semantics.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/rate-semantics.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: resolve HostInfo rate semantics'; git push || true; fi
