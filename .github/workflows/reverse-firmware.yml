name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git

      - name: Resolve wireless client IP/MAC source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
          dev='firmware-src/RootFS-unpacked/bin/device_list'
          out='docs/reverse-generated/run154-wireless-client-identity-source.txt'

          {
            echo '===== RUN 154: get_all_wireless_client identity source ====='
            echo
            echo '===== SYMBOLS ====='
            mipsel-linux-gnu-nm -n "$dev" | grep -Ei 'get_all_wireless_client|wireless|client|arp|ip_info|mac|station|assoc|ifaddrs' || true

            echo
            echo '===== DYNAMIC SYMBOLS ====='
            mipsel-linux-gnu-readelf -Ws "$dev" | grep -Ei 'wireless|client|arp|ip_info|mac|station|assoc|ifaddrs|memcpy|strcmp|ioctl' || true

            echo
            echo '===== GOT ====='
            mipsel-linux-gnu-readelf -A "$dev"

            echo
            echo '===== get_all_wireless_client / helper region ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x40a010 --stop-address=0x40a820 "$dev"

            echo
            echo '===== CALLERS / REFERENCES TO 0x40a46c ====='
            mipsel-linux-gnu-objdump -drwC "$dev" | grep -B30 -A40 -E '40a46c|a46c' || true

            echo
            echo '===== STRINGS AROUND WIRELESS/ARP/CLIENT ====='
            strings -tx "$dev" | grep -Ei 'wireless|wlan|client|station|assoc|arp|ip_info|mac|ethaddr' || true
          } > "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: run154-wireless-client-identity-source
          path: docs/reverse-generated/run154-wireless-client-identity-source.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run154-wireless-client-identity-source.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: resolve wireless client identity source'
            git push
          fi
