name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Trace confsrv dev traffic sender xref
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          conf='firmware-src/RootFS-unpacked/bin/confsrv'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/confsrv-dev-traffic-xref.txt'
          {
            echo '===== RUN 71 GOAL ====='
            echo 'Find the exact confsrv callsite(s) of uc_api_m_cloud_info_send_dev_traffic and the containing function.'
            echo '===== SYMBOL / RELOCATION ====='
            mipsel-linux-gnu-readelf -sW "$conf" | grep -F 'uc_api_m_cloud_info_send_dev_traffic' || true
            mipsel-linux-gnu-readelf -rW "$conf" | grep -F 'uc_api_m_cloud_info_send_dev_traffic' || true
            mipsel-linux-gnu-objdump -R "$conf" | grep -F 'uc_api_m_cloud_info_send_dev_traffic' || true
            echo '===== DISASSEMBLY XREF ====='
            mipsel-linux-gnu-objdump -drwC "$conf" | grep -B28 -A36 -F 'uc_api_m_cloud_info_send_dev_traffic' || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: confsrv-dev-traffic-xref
          path: docs/reverse-generated/confsrv-dev-traffic-xref.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/confsrv-dev-traffic-xref.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add confsrv dev traffic xref'; git push || true; fi
