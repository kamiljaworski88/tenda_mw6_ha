name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Trace callers of enable_cloud_get_sys_basic
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          lib='firmware-src/RootFS-unpacked/lib/libucapi.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/sys-basic-enable-callers.txt'
          {
            echo '===== RUN 61 GOAL ====='
            echo 'Find callers of enable_cloud_get_sys_basic and identify the callback/context passed in a0/a1.'
            echo '===== SYMBOLS ====='
            mipsel-linux-gnu-readelf -sW "$lib" | grep -E 'uc_api_enable_m_cloud_info|enable_cloud_get_sys_basic|uc_api_set_basic_info' || true
            echo '===== DIRECT/ANNOTATED REFERENCES ====='
            mipsel-linux-gnu-objdump -drwC "$lib" | grep -B18 -A24 -E 'enable_cloud_get_sys_basic|0*a3fc|a3fc <' || true
            echo '===== GOT WORD SEARCH FOR 0x0000a3fc ====='
            mipsel-linux-gnu-objdump -s -j .got "$lib" | grep -i -B2 -A2 'fca30000' || true
            echo '===== uc_api_enable_m_cloud_info WINDOW ====='
            addr=$(mipsel-linux-gnu-readelf -sW "$lib" | awk '$8=="uc_api_enable_m_cloud_info" {print $2; exit}')
            if [ -n "${addr:-}" ]; then
              start=$((16#$addr))
              stop=$((start+0x900))
              mipsel-linux-gnu-objdump -drwC --start-address=$start --stop-address=$stop "$lib" || true
            fi
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: sys-basic-enable-callers
          path: docs/reverse-generated/sys-basic-enable-callers.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/sys-basic-enable-callers.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add SYS BasicInfo enable caller trace'; git push || true; fi
