name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3
      - name: Recover native cmdrpc request path
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          ctl='firmware-src/RootFS-unpacked/lib/libcmdctl.so'
          srv='firmware-src/RootFS-unpacked/sbin/cmdsrv'
          cli='firmware-src/RootFS-unpacked/sbin/cmdcli'
          testbin='firmware-src/RootFS-unpacked/sbin/cmdctl_test'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/cmdrpc-path.txt'
          {
            echo '===== RUN 36 GOAL ====='
            echo 'Explain why TCP/12598 becomes globally subscribe-only and recover the native libcmdctl request/reply pattern (cmdrpc@...).'
            echo '===== libcmdctl symbols ====='
            mipsel-linux-gnu-readelf -sW "$ctl" | grep -E 'cmd_(init|sub|pub|get|set)|cmdsh_random_key|command_(connect|read|close)|redis|Base64' || true
            echo '===== libcmdctl reloc/GOT ====='
            mipsel-linux-gnu-readelf -rW "$ctl" || true
            echo '===== full helper T.54 / command path ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x1868 --stop-address=0x1eac "$ctl" || true
            echo '===== cmd_init ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x1040 --stop-address=0x10e8 "$ctl" || true
            echo '===== cmd_sub ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x17bc --stop-address=0x1868 "$ctl" || true
            echo '===== cmd_pub/get/set ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x1e04 --stop-address=0x2040 "$ctl" || true
            echo '===== libcmdctl strings ====='
            strings -a -t x "$ctl" | grep -E -B8 -A12 'cmdrpc@|publish|subscribe|unsubscribe|command_connect|command_read|Base64|urandom' || true
            echo '===== cmdsrv subscribe-mode enforcement ====='
            mipsel-linux-gnu-objdump -drwC "$srv" | grep -n -B20 -A50 -E 'SUBSCRIBE|subscribe mode|UNSUBSCRIBE|QUIT|only .*SUBSCRIBE' || true
            strings -a -t x "$srv" | grep -iE -B10 -A15 'subscribe|unsubscribe|quit|only' || true
            echo '===== cmdcli usage / behavior ====='
            strings -a -t x "$cli" | grep -iE -B12 -A20 'usage|subscribe|publish|raw|encrypt|server|listen|redis' || true
            mipsel-linux-gnu-readelf -sW "$cli" | head -n 250 || true
            echo '===== cmdctl_test callsites ====='
            mipsel-linux-gnu-objdump -drwC "$testbin" | grep -n -B20 -A40 -E 'cmd_(get|set|pub|sub)' || true
          } > "$out"
          head -c 1800000 "$out" > /tmp/cut && mv /tmp/cut "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: cmdrpc-path
          path: docs/reverse-generated/cmdrpc-path.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/cmdrpc-path.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: recover native cmdrpc path'; git push || true; fi
