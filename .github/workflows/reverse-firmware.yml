name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git

      - name: Resolve wired client identity source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
          dev='firmware-src/RootFS-unpacked/bin/device_list'
          out='docs/reverse-generated/run157-wired-client-identity-source.txt'

          {
            echo '===== RUN 157: wired client identity source ====='
            echo
            echo '===== DISASSEMBLY 0x408900..0x409900 ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x408900 --stop-address=0x409900 "$dev"

            echo
            echo '===== GOT ====='
            mipsel-linux-gnu-readelf -A "$dev"

            echo
            echo '===== SYMBOLS / STRINGS ====='
            mipsel-linux-gnu-readelf -Ws "$dev" | grep -Ei 'wired|wire_client|client|arp|l2|switch|mac|eth' || true
            strings -tx "$dev" | grep -Ei 'wired client|update_wire_client_from_sw_list|del_wire_client_not_in_sw_l2_list|find_if_arp_in_arp_list_by_mac|get_proc_arp_list|sw_l2|arp' || true
          } > "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: run157-wired-client-identity-source
          path: docs/reverse-generated/run157-wired-client-identity-source.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run157-wired-client-identity-source.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: resolve wired client identity source'
            git push
          fi
