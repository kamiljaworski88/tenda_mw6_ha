name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reverse-firmware.yml'

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install reverse tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3
      - name: Fetch firmware dump
        run: |
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p reports docs/reverse-generated
      - name: Disassemble client/cloud stack
        run: |
          root='firmware-src/RootFS-unpacked'
          for f in "$root/lib/libcommon.so" "$root/lib/libcloud.so" "$root/lib/libucapi.so" "$root/lib/libpb.so" "$root/bin/device_list" "$root/bin/confsrv" "$root/bin/ucloud"; do
            [ -f "$f" ] || continue
            safe=$(echo "${f#$root/}" | tr '/' '_')
            mipsel-linux-gnu-readelf -aW "$f" > "reports/$safe.readelf.txt" 2>&1 || true
            mipsel-linux-gnu-objdump -drwC "$f" > "reports/$safe.objdump.txt" 2>&1 || true
            strings -a -t x "$f" > "reports/$safe.strings.txt" || true
          done
      - name: Build compact client API map
        run: |
          out='docs/reverse-generated/client-api-map.txt'
          : > "$out"
          echo '# Auto-generated MW6 client/cloud API map' >> "$out"
          echo '# Source: public MW6 firmware dump; generated by GitHub Actions' >> "$out"
          echo >> "$out"
          for f in reports/*.strings.txt; do
            echo "===== $f : strings =====" >> "$out"
            grep -iE -C 6 'GetHostList|confctl_get_host_list|fill_host_lists_info|fill_host_lists_rate|fill_host_info_from_client_status|device_list_upload|fill_cloud_info_device_lists_rate|send_dev_device|DEV_UPLOAD_DEVIC|DEV_TRAFFIC|M_CLOUD_INFO|online_ip|g_ip_info|host.*rate' "$f" >> "$out" || true
          done
          for f in reports/*.readelf.txt; do
            echo "===== $f : symbols =====" >> "$out"
            grep -iE 'get_host_list|host_list|host_info|device|client|cloud|rate|online_ip|statistic|ucapi|send_dev' "$f" >> "$out" || true
          done
          echo '===== confsrv GetHostList function =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC --disassemble=confctl_get_host_list firmware-src/RootFS-unpacked/bin/confsrv >> "$out" 2>&1 || true
          echo '===== confsrv fill_host_lists_info =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC --disassemble=fill_host_lists_info firmware-src/RootFS-unpacked/bin/confsrv >> "$out" 2>&1 || true
          echo '===== confsrv fill_host_lists_rate =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC --disassemble=fill_host_lists_rate firmware-src/RootFS-unpacked/bin/confsrv >> "$out" 2>&1 || true
          echo '===== confsrv fill_host_info_from_client_status =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC --disassemble=fill_host_info_from_client_status firmware-src/RootFS-unpacked/bin/confsrv >> "$out" 2>&1 || true
          echo '===== confsrv cloud rate builder =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC --disassemble=fill_cloud_info_device_lists_rate firmware-src/RootFS-unpacked/bin/confsrv >> "$out" 2>&1 || true
          echo '===== libucapi cloud-info symbols =====' >> "$out"
          grep -n -iE -B20 -A80 'ol_hosts|host_list|dev_device|dev_traffic|m_cloud_info' reports/lib_libucapi.so.objdump.txt >> "$out" || true
          head -c 950000 "$out" > "$out.tmp" && mv "$out.tmp" "$out"
      - name: Commit compact map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/client-api-map.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: refresh generated client API map'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mw6-client-cloud-reverse-reports
          path: reports/
          retention-days: 14
