name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git xz-utils python3-pip
          python3 -m pip install --break-system-packages vmlinux-to-elf

      - name: Map skb header copy fields
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated /tmp/mw6kernel
          img='firmware-src/image-unpacked-as-per-mtd/30_KernelFS'
          raw='/tmp/mw6kernel/kernel.raw'
          elf='/tmp/mw6kernel/kernel.elf'
          out='docs/reverse-generated/run141-skb-header-copy-map.txt'

          dd if="$img" of=/tmp/mw6kernel/kernel.lzma bs=1 skip=$((0x2818)) status=none
          xz --format=lzma -dc /tmp/mw6kernel/kernel.lzma > "$raw" || true
          test -s "$raw"
          vmlinux-to-elf "$raw" "$elf" >/tmp/mw6kernel/v2e.log 2>&1

          {
            echo '===== RUN 141: MW6 sk_buff header copy / field map ====='
            echo 'Known: skb_iif ~= +0x70, unknown words +0x74/+0x78, rxhash = +0x7c.'
            echo

            echo '===== SYMBOLS 0x8037f000..0x8037f900 ====='
            mipsel-linux-gnu-nm -n "$elf" | awk '$1 >= "8037f000" && $1 <= "8037f900" {print}'

            echo
            echo '===== COPY/CLONE REGION ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x8037f000 --stop-address=0x8037f900 "$elf"

            echo
            echo '===== CORE DEV RX REGION ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x8038a470 --stop-address=0x8038a650 "$elf"

            echo
            echo '===== RXHASH REGION ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x80389130 --stop-address=0x80389260 "$elf"

            echo
            echo '===== TC/FW CLASSIFIERS AROUND KNOWN SYMBOLS ====='
            for spec in               '803b3c80 803b3e80 u32_classify'               '803b4750 803b4920 fw_change'               '803a8708 803a8910 sch_direct_xmit'; do
              set -- $spec
              echo "--- $3 ---"
              mipsel-linux-gnu-objdump -drwC --start-address=0x$1 --stop-address=0x$2 "$elf"
            done

            echo
            echo '===== FUNCTIONS REFERENCING EXACT OFFSETS +0x70/+0x74/+0x78/+0x7c ====='
            mipsel-linux-gnu-objdump -drwC "$elf" > /tmp/mw6kernel/all.dis
            python3 - /tmp/mw6kernel/all.dis <<'PY'
          import re,sys
          from pathlib import Path
          lines=Path(sys.argv[1]).read_text(errors='replace').splitlines()
          funcs=[]
          for i,l in enumerate(lines):
              m=re.match(r'^([0-9a-fA-F]+) <([^>]+)>:',l)
              if m: funcs.append((i,int(m.group(1),16),m.group(2)))
          for fi,(st,addr,name) in enumerate(funcs):
              en=funcs[fi+1][0] if fi+1<len(funcs) else len(lines)
              block=lines[st:en]
              hits=[]
              for bi,l in enumerate(block):
                  m=re.search(r'\b(lw|sw|lh|lhu|sh|lb|lbu|sb)\s+[^,]+,(112|116|120|124)\(([a-z0-9]+)\)',l,re.I)
                  if m: hits.append((bi,l))
              if not hits: continue
              # Keep network/skb/netfilter/driver functions, plus copy/clone/allocation functions.
              if not re.search(r'skb|netif|conntrack|rtl|packet|bridge|br_|ip_|udp|tcp|fastpath|nat|qdisc|classif|copy|clone|alloc',name,re.I):
                  continue
              print(f"\n--- 0x{addr:08x} <{name}> ---")
              seen=set()
              for bi,l in hits:
                  lo=max(0,bi-4); hi=min(len(block),bi+6)
                  key=(lo,hi)
                  if key in seen: continue
                  seen.add(key)
                  print("\n".join(block[lo:hi]))
                  print("...")
          PY
          } > "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: run141-skb-header-copy-map
          path: docs/reverse-generated/run141-skb-header-copy-map.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run141-skb-header-copy-map.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: map skb header copy fields'
            git push
          fi
