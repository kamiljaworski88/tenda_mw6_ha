name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reverse-firmware.yml'

permissions:
  contents: read

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install reverse tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3
      - name: Fetch firmware dump
        run: |
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p reports
      - name: Disassemble command transport and cloud stack
        run: |
          root='firmware-src/RootFS-unpacked'
          for f in "$root/sbin/cmdsrv" "$root/sbin/cmdcli" "$root/sbin/cmdctl_test" "$root/lib/libredis.so" "$root/lib/libcmdctl.so" "$root/lib/libcm.so" "$root/lib/libcommon.so" "$root/lib/libcloud.so" "$root/lib/libucapi.so" "$root/lib/libpb.so" "$root/bin/device_list" "$root/bin/confsrv" "$root/bin/ucloud"; do
            [ -f "$f" ] || continue
            safe=$(echo "${f#$root/}" | tr '/' '_')
            file "$f" > "reports/$safe.file.txt"
            mipsel-linux-gnu-readelf -aW "$f" > "reports/$safe.readelf.txt" 2>&1 || true
            mipsel-linux-gnu-objdump -drwC "$f" > "reports/$safe.objdump.txt" 2>&1 || true
            mipsel-linux-gnu-objdump -s "$f" > "reports/$safe.sections.txt" 2>&1 || true
            strings -a -t x "$f" > "reports/$safe.strings.txt" || true
          done
      - name: Extract client-list and cloud-info clues
        run: |
          grep -RniE 'device_list_upload|rqst_client_hostname|rsp_client_hostname|fill_cloud_info_device_lists_rate|fill_cloud_info_device_upload_all|send_dev_device|DEV_UPLOAD_DEVIC|DEV_UPLOAD_STATU|M_CLOUD_INFO|confctl_srv_key|cmd_pub|cmd_sub|cmd_get|cmd_set' reports > reports/client-cloud-clues.txt || true
          grep -n -B40 -A160 -E '<confctl_device_list_upload|<confctl_rqst_client_hostname|fill_cloud_info_device_lists_rate|fill_cloud_info_device_upload_all' reports/bin_confsrv.objdump.txt > reports/confsrv-client-functions.txt || true
          grep -RniE 'encrypt|decrypt|cipher|crypt|base64|raw redis|without encryption|cm_io_connect|cm_io_read|cm_io_write|tcp://|redis_option|subscribe|publish|confctl_srv_key' reports > reports/transport-clues.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: mw6-client-cloud-reverse-reports
          path: reports/
          retention-days: 14
