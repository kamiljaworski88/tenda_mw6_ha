name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Trace device_list process and timer lifecycle
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
          root='firmware-src/RootFS-unpacked'
          dev="$root/bin/device_list"
          mon="$root/bin/monitor"
          timer="$root/bin/timer"
          common="$root/lib/libcommon.so"
          out='docs/reverse-generated/run172-device-list-process-timer-lifecycle.txt'
          {
            echo '===== RUN 172: device_list process and timer lifecycle ====='
            echo
            echo '===== init scripts: launch and supervision references ====='
            grep -RInE '(^|[^[:alnum:]_])(device_list|timer|monitor)([^[:alnum:]_]|$)' \
              "$root/etc_ro" "$root/usr" 2>/dev/null || true
            echo
            echo '===== monitor strings relevant to process supervision ====='
            strings -a -t x "$mon" | grep -Ei -B4 -A8 \
              'device_list|timer|start|restart|respawn|fork|exec|waitpid|kill|pid' || true
            echo
            echo '===== monitor dynamic symbols ====='
            mipsel-linux-gnu-readelf -Ws "$mon" | grep -Ei \
              'main|fork|exec|wait|kill|signal|system|popen|sleep|timer|device' || true
            echo
            echo '===== monitor full disassembly ====='
            mipsel-linux-gnu-objdump -drwC "$mon" || true
            echo
            echo '===== timer metadata, strings and dynamic symbols ====='
            mipsel-linux-gnu-readelf -hSWdWs "$timer" || true
            strings -a -t x "$timer" || true
            echo
            echo '===== timer full disassembly ====='
            mipsel-linux-gnu-objdump -drwC "$timer" || true
            echo
            echo '===== device_list entry/startup symbols ====='
            mipsel-linux-gnu-readelf -hSWdWs "$dev" | grep -Ei \
              'Entry point|main|timer|thread|signal|fork|exec|sleep|cmd_pub|upload|client' || true
            echo
            echo '===== device_list startup and timer references ====='
            strings -a -t x "$dev" | grep -Ei -B5 -A12 \
              'timer|device_list|upload|confctl_srv_key|cmd_pub|thread|init|daemon|pid' || true
            mipsel-linux-gnu-objdump -drwC "$dev" | grep -B50 -A100 -E \
              'timer_check_ok_and_wait|timer_start|timer_stop|cmd_pub|do_upload_client_list' || true
            echo
            echo '===== libcommon timer dependencies and strings ====='
            mipsel-linux-gnu-readelf -Ws "$common" | grep -Ei \
              'timer_start|timer_stop|timer_check|access|unlink|sleep|socket|connect|send|recv|open|stat' || true
            strings -a -t x "$common" | grep -Ei -B8 -A12 \
              'timer|socket|pid|check.*ok|wait' || true
            echo
            echo '===== libcommon timer functions with resolved relocations ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x39c04 --stop-address=0x39fdc "$common" || true
            echo
            echo '===== libcommon GOT entries used by timer functions ====='
            mipsel-linux-gnu-readelf -A "$common" | grep -E -- \
              '-32728\(gp\)|-32648\(gp\)|-32280\(gp\)|-32164\(gp\)|-31768\(gp\)|-31756\(gp\)|-31724\(gp\)|-31632\(gp\)|-31568\(gp\)' || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: run172-device-list-process-timer-lifecycle
          path: docs/reverse-generated/run172-device-list-process-timer-lifecycle.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add docs/reverse-generated/run172-device-list-process-timer-lifecycle.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: trace device_list timer lifecycle'
            git push
          fi
