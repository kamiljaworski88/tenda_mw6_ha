name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3
      - name: Trace GetHostList cmdrpc callsite
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          cli='firmware-src/RootFS-unpacked/bin/confcli'
          ctl='firmware-src/RootFS-unpacked/lib/libcmdctl.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/gethostlist-cmdrpc-callsite.txt'
          mipsel-linux-gnu-objdump -drwC "$cli" > /tmp/cli.asm
          mipsel-linux-gnu-readelf -sW "$cli" > /tmp/cli.syms
          {
            echo '===== RUN 38 GOAL ====='
            echo 'Tie GetHostList in confcli to the exact libcmdctl/cmdrpc request/reply sequence and arguments.'
            echo '===== CONFCLI RELEVANT SYMBOLS ====='
            grep -iE 'GetHostList|host_list|hostlist|cmd_pub|cmd_sub|cmd_get|cmdsh|conf_msg|confctl_cli_key|confctl_srv_key' /tmp/cli.syms || true
            echo '===== STRINGS WITH OFFSETS ====='
            strings -a -t x "$cli" | grep -iE -B8 -A12 'GetHostList|confctl_cli_key|confctl_srv_key|cmdrpc@|host list|host_list' || true
            echo '===== ALL CMD_PUB CALLS NEAR GETHOSTLIST STRING USERS ====='
            grep -n -B45 -A70 'cmd_pub' /tmp/cli.asm | head -n 1400 || true
            echo '===== ALL CMD_SUB CALLS ====='
            grep -n -B45 -A70 'cmd_sub' /tmp/cli.asm | head -n 1000 || true
            echo '===== ALL CALLS THROUGH GOT OFFSETS FOR CMD_PUB/CMD_SUB ====='
            grep -n -E -B35 -A55 '(-31212|-31784)\(gp\)' /tmp/cli.asm | head -n 1800 || true
            echo '===== GET/HOSTLIST STRING REFERENCES ====='
            grep -n -i -E -B50 -A90 'GetHostList|host.?list|confctl_cli_key|confctl_srv_key' /tmp/cli.asm | head -n 1800 || true
            echo '===== LIBCMDCTL RANDOM KEY / RPC HELPER ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x1f20 --stop-address=0x211c "$ctl" || true
            echo '===== LIBCMDCTL GENERIC REQUEST BUILDER ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x1868 --stop-address=0x1e04 "$ctl" || true
          } > "$out"
          head -c 2400000 "$out" > /tmp/cut && mv /tmp/cut "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: gethostlist-cmdrpc-callsite
          path: docs/reverse-generated/gethostlist-cmdrpc-callsite.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/gethostlist-cmdrpc-callsite.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: trace GetHostList cmdrpc callsite'; git push || true; fi
