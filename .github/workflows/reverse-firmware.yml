name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git

      - name: Trace kernel netlink statistics handler
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/run119-kernel-stat-handler.txt'
          root='firmware-src/RootFS-unpacked/lib/modules'
          {
            echo '===== RUN 119: kernel-side statistics/netlink handler ====='
            echo
            echo '===== COMMON_NETLINK MODULE SYMBOLS ====='
            mipsel-linux-gnu-nm -a "$root/common_netlink.ko" || true
            echo
            echo '===== COMMON_NETLINK DISASSEMBLY + RELOCATIONS ====='
            mipsel-linux-gnu-objdump -drwC "$root/common_netlink.ko" || true
            echo
            echo '===== MODULES IMPORTING/EXPORTING COMMON NETLINK API ====='
            find "$root" -type f -name '*.ko' -size +0c -print0 | while IFS= read -r -d '' f; do
              hits=$(mipsel-linux-gnu-nm -a "$f" 2>/dev/null | grep -Ei 'common_netlink|netlink_msg_to_user|send_to_user' || true)
              if [ -n "$hits" ]; then
                echo "--- $f ---"
                echo "$hits"
              fi
            done
            echo
            echo '===== MODULE STRINGS RELATED TO CLIENT STATISTICS ====='
            find "$root" -type f -name '*.ko' -size +0c -print0 | while IFS= read -r -d '' f; do
              hits=$(strings -a "$f" | grep -Ei 'online|client|host|statistic|traffic|up_bytes|down_bytes|ip_info|netlink|fastpath|hw_nat|sw_nat' | head -n 120 || true)
              if [ -n "$hits" ]; then
                echo "--- $f ---"
                echo "$hits"
              fi
            done
            echo
            echo '===== MODULE SYMBOLS RELATED TO STATISTICS/CLIENT TRACKING ====='
            find "$root" -type f -name '*.ko' -size +0c -print0 | while IFS= read -r -d '' f; do
              hits=$(mipsel-linux-gnu-nm -a "$f" 2>/dev/null | grep -Ei 'statistic|traffic|online|client|ip_info|host|nat.*stat|stat.*nat' | head -n 160 || true)
              if [ -n "$hits" ]; then
                echo "--- $f ---"
                echo "$hits"
              fi
            done
          } > "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: run119-kernel-stat-handler
          path: docs/reverse-generated/run119-kernel-stat-handler.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run119-kernel-stat-handler.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: trace kernel netlink statistics handler'
            git push
          fi
