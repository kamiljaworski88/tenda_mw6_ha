name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git xz-utils python3-pip
          python3 -m pip install --break-system-packages vmlinux-to-elf

      - name: Trace corrected online_ip counters
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated /tmp/mw6kernel
          img='firmware-src/image-unpacked-as-per-mtd/30_KernelFS'
          raw='/tmp/mw6kernel/kernel.raw'
          elf='/tmp/mw6kernel/kernel.elf'
          out='docs/reverse-generated/run129-onlineip-correct-counter-offsets.txt'

          dd if="$img" of=/tmp/mw6kernel/kernel.lzma bs=1 skip=$((0x2818)) status=none
          xz --format=lzma -dc /tmp/mw6kernel/kernel.lzma > "$raw" || true
          test -s "$raw"
          vmlinux-to-elf "$raw" "$elf" >/tmp/mw6kernel/v2e.log 2>&1
          mipsel-linux-gnu-nm -n "$elf" > /tmp/mw6kernel/kernel.syms

          python3 - "$elf" "$out" <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          elf = Path(sys.argv[1])
          out = Path(sys.argv[2])
          nm = subprocess.check_output(
              ["mipsel-linux-gnu-nm", "-n", str(elf)],
              text=True,
              errors="replace",
          ).splitlines()

          funcs = []
          all_syms = {}
          for line in nm:
              p = line.split(maxsplit=2)
              if len(p) != 3:
                  continue
              try:
                  addr = int(p[0], 16)
              except ValueError:
                  continue
              typ, name = p[1], p[2]
              all_syms[name] = addr
              if typ.lower() in ("t", "w"):
                  funcs.append((addr, typ, name))
          funcs.sort()

          bounds = {}
          for i, (addr, typ, name) in enumerate(funcs):
              nxt = funcs[i + 1][0] if i + 1 < len(funcs) else addr + 0x1000
              bounds[name] = (addr, nxt)

          def disasm(start, stop):
              return subprocess.check_output(
                  [
                      "mipsel-linux-gnu-objdump", "-drwC",
                      f"--start-address=0x{start:x}",
                      f"--stop-address=0x{stop:x}",
                      str(elf),
                  ],
                  text=True,
                  errors="replace",
              ).splitlines()

          def dump_function(handle, name, cap=0x10000):
              if name not in bounds:
                  handle.write(f"\n===== {name}: NOT FOUND =====\n")
                  return []
              start, stop = bounds[name]
              stop = min(stop, start + cap)
              lines = disasm(start, stop)
              handle.write(f"\n===== FUNCTION {name} 0x{start:08x}..0x{stop:08x} =====\n")
              handle.write("\n".join(lines) + "\n")
              return lines

          # Correct record layout from the already recovered libcommon rate code:
          # two 64-bit snapshot pairs occupy 0x18..0x34.
          # +0x40 is the activity flag set by nf_conntrack_in.
          target_offsets = {0x18,0x1c,0x20,0x24,0x28,0x2c,0x30,0x34,0x40}

          candidate_re = re.compile(
              r"(conntrack|fastpath|hwnat|hw_nat|online_ip|statistic|rtl865x_handle_nat|rtl_fptimer|fast_nat)",
              re.I,
          )

          mem_re = re.compile(
              r"\b(lw|sw|lbu|sb|lhu|sh)\s+([a-z0-9]+),(-?(?:0x[0-9a-f]+|[0-9]+))\(([a-z0-9]+)\)"
          )
          move_re = re.compile(r"\bmove\s+([a-z0-9]+),([a-z0-9]+)")
          addiu_re = re.compile(
              r"\baddiu\s+([a-z0-9]+),([a-z0-9]+),(-?(?:0x[0-9a-f]+|[0-9]+))"
          )
          addu_re = re.compile(r"\baddu\s+([a-z0-9]+),([a-z0-9]+),([a-z0-9]+)")
          ins_re = re.compile(r"^\s*([0-9a-fA-F]+):\s+[0-9a-fA-F]+\s+([a-z0-9.]+)\s*(.*)$")

          def imm(s):
              return int(s, 0)

          interesting = []
          for start, typ, name in funcs:
              if not candidate_re.search(name):
                  continue
              stop = bounds[name][1]
              if stop <= start or stop - start > 0x18000:
                  continue
              lines = disasm(start, stop)
              taint = {}
              for idx, line in enumerate(lines):
                  im = ins_re.match(line)
                  if not im:
                      continue
                  mnemonic = im.group(2)
                  operands = im.group(3)

                  mm = mem_re.search(mnemonic + " " + operands)
                  if mm:
                      op, reg, off_s, base = mm.groups()
                      off = imm(off_s)
                      if op == "lw" and off == 140:
                          # ct->online_ip
                          taint[reg] = 0
                      elif base in taint:
                          eff = taint[base] + off
                          if eff in target_offsets:
                              interesting.append((name, start, idx, eff, lines))
                      if op in ("lw", "lbu", "lhu") and not (op == "lw" and off == 140):
                          taint.pop(reg, None)
                      continue

                  mm = move_re.search(mnemonic + " " + operands)
                  if mm:
                      dst, src = mm.groups()
                      if src in taint:
                          taint[dst] = taint[src]
                      else:
                          taint.pop(dst, None)
                      continue

                  mm = addiu_re.search(mnemonic + " " + operands)
                  if mm:
                      dst, src, off_s = mm.groups()
                      if src in taint:
                          taint[dst] = taint[src] + imm(off_s)
                      else:
                          taint.pop(dst, None)
                      continue

                  mm = addu_re.search(mnemonic + " " + operands)
                  if mm:
                      dst, s1, s2 = mm.groups()
                      if s1 in taint and s2 == "zero":
                          taint[dst] = taint[s1]
                      elif s2 in taint and s1 == "zero":
                          taint[dst] = taint[s2]
                      else:
                          taint.pop(dst, None)
                      continue

                  # Conservative kill for common instructions writing first operand.
                  parts = [p.strip() for p in operands.split(",")]
                  if parts and re.match(r"^[a-z0-9]+$", parts[0]) and mnemonic not in (
                      "sw","sb","sh","beq","bne","beqz","bnez","jr","jal","jalr","j"
                  ):
                      taint.pop(parts[0], None)

          with out.open("w", encoding="utf-8") as o:
              o.write("===== RUN 129: corrected online_ip counter offsets =====\n")
              o.write("Correct target words: +0x18,+0x1c,+0x20,+0x24,+0x28,+0x2c,+0x30,+0x34; activity flag +0x40.\n")
              o.write("Previous +0x50..+0x6c scan was based on a wrong offset assumption.\n")

              dump_function(o, "online_ip_seq_show")
              dump_function(o, "rtl_hwnat_timer_update")
              dump_function(o, "rtl_fpTimer_update")
              dump_function(o, "rtl865x_handle_nat")
              dump_function(o, "FastPath_Enter")
              dump_function(o, "nf_conntrack_in")

              o.write("\n===== TAINTED ct->online_ip ACCESSES TO CORRECT OFFSETS =====\n")
              seen = set()
              for name, start, idx, eff, lines in interesting:
                  key = (name, idx, eff)
                  if key in seen:
                      continue
                  seen.add(key)
                  o.write(f"\n--- {name} @ 0x{start:08x}; online_ip+0x{eff:02x} ---\n")
                  lo = max(0, idx - 10)
                  hi = min(len(lines), idx + 14)
                  o.write("\n".join(lines[lo:hi]) + "\n")

              # Find direct callers of the flag helpers; these reveal which paths
              # explicitly participate in online_ip lifecycle/accounting.
              for helper in ("set_online_ip_flag", "clear_online_ip_flag"):
                  addr = all_syms.get(helper)
                  o.write(f"\n===== CALLERS OF {helper} {addr and hex(addr)} =====\n")
                  if addr is None:
                      continue
                  jal = 0x0c000000 | ((addr >> 2) & 0x03ffffff)
                  needle = f"{jal:08x}"
                  for start, typ, name in funcs:
                      if not candidate_re.search(name):
                          continue
                      stop = bounds[name][1]
                      if stop <= start or stop - start > 0x18000:
                          continue
                      lines = disasm(start, stop)
                      for idx, line in enumerate(lines):
                          # objdump prints both raw opcode and resolved symbol.
                          if f"<{helper}>" in line:
                              o.write(f"{name}: {line}\n")
                              o.write("\n".join(lines[max(0,idx-8):min(len(lines),idx+10)]) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: run129-onlineip-correct-counter-offsets
          path: docs/reverse-generated/run129-onlineip-correct-counter-offsets.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run129-onlineip-correct-counter-offsets.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: correct online_ip counter offset scan'
            git push
          fi
