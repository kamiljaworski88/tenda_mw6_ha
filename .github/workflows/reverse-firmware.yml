name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Trace per-client traffic builder
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          cloud='firmware-src/RootFS-unpacked/lib/libcloud.so'
          conf='firmware-src/RootFS-unpacked/bin/confsrv'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/per-client-traffic-builder.txt'
          {
            echo '===== RUN 66 GOAL ====='
            echo 'Trace the firmware path that builds per-client {mac,up,down} traffic data and identify its source/callers.'
            echo '===== LIBCLOUD TARGET STRINGS ====='
            strings -a -t x "$cloud" | grep -Ei '\{"mac":"%s","up":%d,"down":%d\}|ethaddr|uprate|downrate|traffic' | head -n 220 || true
            echo '===== LIBCLOUD SYMBOLS ====='
            mipsel-linux-gnu-readelf -sW "$cloud" | grep -Ei 'traffic|device|host|rate|upload' | head -n 260 || true
            echo '===== LIBCLOUD DISASSEMBLY REFERENCES AROUND 0x6911c STRING OFFSET ====='
            mipsel-linux-gnu-readelf -SW "$cloud" || true
            mipsel-linux-gnu-objdump -drwC "$cloud" | grep -Ei -B16 -A30 '6911c|6913c|mac.*up.*down|traffic' | head -n 420 || true
            echo '===== CONFSRV RATE/CLOUD UPLOAD CLUES ====='
            strings -a -t x "$conf" | grep -Ei -B8 -A20 'up_bytes|down_bytes|uprate|downrate|send_dev_traffic|traffic' | head -n 320 || true
            mipsel-linux-gnu-readelf -sW "$conf" | grep -Ei 'traffic|rate|host|cloud' | head -n 260 || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: per-client-traffic-builder
          path: docs/reverse-generated/per-client-traffic-builder.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/per-client-traffic-builder.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add per-client traffic builder trace'; git push || true; fi
