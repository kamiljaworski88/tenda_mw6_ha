name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3
      - name: Trace confcli GetHostList reply path
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          cli='firmware-src/RootFS-unpacked/bin/confcli'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/confcli-gethostlist-reply-path.txt'
          mipsel-linux-gnu-objdump -drwC "$cli" > /tmp/cli.asm
          mipsel-linux-gnu-readelf -sW "$cli" > /tmp/cli.syms
          {
            echo '===== RUN 45 GOAL ====='
            echo 'B1 only: trace how confcli receives and dispatches a GetHostList reply. No Python changes, no router probing.'
            echo '===== KEY SYMBOLS ====='
            grep -E 'conf_msg_(open|hander|define|all_cmds_init)|confctl_define_callback|main|cmd_(init|sub|pub)' /tmp/cli.syms || true
            echo '===== KEY STRINGS ====='
            strings -a -t x "$cli" | grep -E 'confctl_(cli|srv)_key|GetHostList|GetTrafficInfo|SetHostMarks|GetRemarklist' || true
            echo '===== CONF_MSG_OPEN WINDOW ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x407600 --stop-address=0x407820 "$cli" || true
            echo '===== CONF_MSG_HANDLER WINDOW ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x4071d0 --stop-address=0x407380 "$cli" || true
            echo '===== MAIN WINDOW ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x4064b4 --stop-address=0x4069d0 "$cli" || true
            echo '===== DEFINE CALLBACK WINDOW ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x408690 --stop-address=0x408d60 "$cli" || true
            echo '===== ALL cmd_sub CALLSITES (GOT -31784) ====='
            grep -n -B45 -A80 -- '-31784(gp)' /tmp/cli.asm || true
            echo '===== ALL cmd_init CALLSITES (GOT -31760) ====='
            grep -n -B35 -A60 -- '-31760(gp)' /tmp/cli.asm || true
            echo '===== ALL cmd_pub CALLSITES (GOT -31212) ====='
            grep -n -B25 -A50 -- '-31212(gp)' /tmp/cli.asm | head -n 2400 || true
            echo '===== GET HOST LIST STRING REFERENCES / NEIGHBOR CODE ====='
            grep -n -B50 -A100 -E '67a30|GetHostList' /tmp/cli.asm || true
            echo '===== DYNAMIC RELOCS ====='
            mipsel-linux-gnu-objdump -R "$cli" || true
          } > "$out"
          head -c 2800000 "$out" > /tmp/cut && mv /tmp/cut "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: confcli-gethostlist-reply-path
          path: docs/reverse-generated/confcli-gethostlist-reply-path.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/confcli-gethostlist-reply-path.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: trace confcli GetHostList reply path'; git push || true; fi
