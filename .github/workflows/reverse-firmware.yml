name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Resolve SYS BasicInfo callback target
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          lib='firmware-src/RootFS-unpacked/lib/libucapi.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/sys-basic-enable-target.txt'
          {
            echo '===== RUN 60 GOAL ====='
            echo 'Resolve t9 target gp-31940 and a3 object source in enable_cloud_get_sys_basic.'
            echo '===== KNOWN VALUES ====='
            echo 'function=0x0000a3fc'
            echo 'gp=0x00039ed0'
            echo 't9_slot=gp-31940=0x0003220c'
            echo 'a3_base_slot=gp-32732=0x00031ef4'
            echo 'a3_adjust=-3360 (0xfffff2e0)'
            echo '===== GOT BYTES AROUND 0x31ef4 AND 0x3220c ====='
            mipsel-linux-gnu-objdump -s -j .got --start-address=0x31ee0 --stop-address=0x32230 "$lib" || true
            echo '===== SYMBOLS / ADDRESSES NEAR GOT TARGET VALUES ====='
            mipsel-linux-gnu-readelf -sW "$lib" | grep -E '0000a[0-9a-f]{3}|0001[0-9a-f]{4}|enable_cloud_get_sys_basic|uc_api_set_basic_info|basic_info' || true
            echo '===== ENABLE FUNCTION CHECK ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0xa3fc --stop-address=0xa49c "$lib" || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: sys-basic-enable-target
          path: docs/reverse-generated/sys-basic-enable-target.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/sys-basic-enable-target.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: resolve SYS BasicInfo callback target'; git push || true; fi
