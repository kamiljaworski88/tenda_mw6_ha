name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Map ucapi traffic send GOT target
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          uc='firmware-src/RootFS-unpacked/lib/libucapi.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/ucapi-traffic-send-got.txt'
          {
            echo '===== RUN 69 GOAL ====='
            echo 'Resolve GOT address 0x32108 used by uc_api_m_cloud_info_send_dev_traffic (lw t9,-32200(gp)).'
            echo '===== DYNAMIC RELOCATIONS ====='
            mipsel-linux-gnu-readelf -rW "$uc" | grep -Ei '32108|uc_api|send|dispatch|cmd' || true
            echo '===== DYNAMIC SYMBOLS ====='
            mipsel-linux-gnu-readelf -sW "$uc" | grep -Ei 'send|dispatch|module|cmd|uc_api' | head -n 260 || true
            echo '===== GOT / RELOCATION VIEW ====='
            mipsel-linux-gnu-objdump -R "$uc" | grep -Ei '32108|send|dispatch|cmd|api' || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: ucapi-traffic-send-got
          path: docs/reverse-generated/ucapi-traffic-send-got.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/ucapi-traffic-send-got.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add ucapi traffic send GOT map'; git push || true; fi
