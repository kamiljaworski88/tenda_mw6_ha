name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Resolve upload_statistics second call
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          lib='firmware-src/RootFS-unpacked/lib/libcloud.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/upload-statistics-second-call.txt'
          {
            echo '===== RUN 76 GOAL ====='
            echo 'Resolve lw t9,-32420(gp) at upload_statistics 0x211f8. gp=0x93370, GOT address=0x8b4cc.'
            echo '===== GOT BYTES AROUND 0x8b4cc ====='
            mipsel-linux-gnu-objdump -s -j .got "$lib" | grep -Ei '^ 8b4b0|^ 8b4c0|^ 8b4d0|^ 8b4e0|^ 8b4f0' || true
            echo '===== STUB / SYMBOL RESOLUTION ====='
            mipsel-linux-gnu-readelf -sW "$lib" | nl -ba | sed -n '1,1700p' || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: upload-statistics-second-call
          path: docs/reverse-generated/upload-statistics-second-call.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/upload-statistics-second-call.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add upload_statistics second-call report'; git push || true; fi
