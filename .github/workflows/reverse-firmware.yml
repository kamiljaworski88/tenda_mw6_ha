name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reverse-firmware.yml'
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - run: |
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
      - name: Trace confcli/confsrv IPC
        run: |
          root='firmware-src/RootFS-unpacked'
          out='docs/reverse-generated/confcli-ipc.txt'
          : > "$out"
          for f in "$root/bin/confcli" "$root/bin/confsrv" "$root/lib/libcmdctl.so"; do
            [ -f "$f" ] || continue
            echo "===== $f symbols =====" >> "$out"
            mipsel-linux-gnu-readelf -sW "$f" | grep -E 'conf_msg|confctl|cmd_(pub|sub|init|get|set)|GetHostList|main' >> "$out" || true
            echo "===== $f GOT / relocations =====" >> "$out"
            mipsel-linux-gnu-readelf -aW "$f" | grep -E -C 4 'cmd_pub|cmd_sub|cmd_init|cmd_get|cmd_set' >> "$out" || true
            echo "===== $f strings =====" >> "$out"
            strings -a -t x "$f" | grep -E -i -C 5 'confctl_(cli|srv)_key|GetHostList|GetTrafficInfo|cmdrpc|device_list_upload' >> "$out" || true
          done
          echo '===== confcli disassembly refs =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC "$root/bin/confcli" | grep -n -B120 -A220 -E 'conf_msg_(open|close|send|request|handler)|cmd_pub|cmd_sub|cmd_init|GetHostList|confctl_cli_key|confctl_srv_key' >> "$out" || true
          echo '===== confsrv init refs =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC "$root/bin/confsrv" | grep -n -B100 -A180 -E 'cmd_pub|cmd_sub|cmd_init|conf_msg_hander|confctl_srv_key|confctl_cli_key' >> "$out" || true
          head -c 950000 "$out" > /tmp/o && mv /tmp/o "$out"
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/confcli-ipc.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: refresh confcli IPC map'; git push; fi
