name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git

      - name: Resolve client online refresh pipeline
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated /tmp/run150
          conf='firmware-src/RootFS-unpacked/bin/confsrv'
          out='docs/reverse-generated/run150-client-online-refresh-pipeline.txt'
          mipsel-linux-gnu-objdump -drwC "$conf" > /tmp/run150/confsrv.dis
          mipsel-linux-gnu-readelf -Ws "$conf" > /tmp/run150/confsrv.sym

          python3 - /tmp/run150/confsrv.dis /tmp/run150/confsrv.sym "$out" <<'PY'
          import re, sys
          from pathlib import Path

          lines=Path(sys.argv[1]).read_text(errors='replace').splitlines()
          symtxt=Path(sys.argv[2]).read_text(errors='replace')
          out=Path(sys.argv[3])

          # Function-name strings are based at the rodata object reached as 0x470000 + imm.
          fn_strings={
              0x3040:"fill_host_info_from_client_status",
              0x3120:"device_client_offline_check",
              0x317c:"update_client_info_to_hash_table",
              0x31a0:"add_new_client_to_hash_table",
              0x31c0:"upload_client_online_status_change",
          }

          # Discover stripped local function starts from the standard PIC prologue:
          #   lui gp,...
          #   addiu gp,...
          #   addu gp,gp,t9
          # followed shortly by stack allocation.
          starts=[]
          for i,l in enumerate(lines):
              m=re.match(r'^\s*([0-9a-fA-F]+):\s+.*\blui\s+gp,',l)
              if not m: continue
              a=int(m.group(1),16)
              nxt="\n".join(lines[i:min(len(lines),i+8)])
              if re.search(r'\baddu\s+gp,gp,t9',nxt) and re.search(r'\baddiu\s+sp,sp,-',nxt):
                  starts.append((i,a))
          starts=sorted(starts)

          def block_for_addr(addr):
              for k,(i,a) in enumerate(starts):
                  if a==addr:
                      e=starts[k+1][0] if k+1<len(starts) else len(lines)
                      return i,e
              return None,None

          def owner(idx):
              prev=None
              for i,a in starts:
                  if i>idx: break
                  prev=(i,a)
              return prev

          # Restrict to the client-management area.
          focus=[(i,a) for i,a in starts if 0x431500 <= a < 0x432b80]
          named=[]
          for k,(i,a) in enumerate(focus):
              # end by next global discovered start, not only focus end
              allidx=next(x for x,(ii,aa) in enumerate(starts) if ii==i and aa==a)
              e=starts[allidx+1][0] if allidx+1<len(starts) else len(lines)
              b=lines[i:e]
              names=[]
              for imm,name in fn_strings.items():
                  # __FUNCTION__ pointer is built from rodata-base pointer + immediate.
                  # Match both decimal and canonical hex immediates.
                  dec=str(imm)
                  hx=f"0x{imm:x}"
                  if any(re.search(rf'\baddiu\s+[a-z0-9]+,[a-z0-9]+,(?:{re.escape(dec)}|{re.escape(hx)})\b',x,re.I) for x in b):
                      names.append(name)
              named.append((a,names,b))

          # Exact important writes/reads to online +0x84 and last_seen +0x88.
          state_sites=[]
          for i,l in enumerate(lines):
              if not (re.search(r'\b(?:lbu|sb|lw|sw)\s+[^,]+,(132|136)\([^)]+\)',l,re.I)):
                  continue
              o=owner(i)
              if not o or not (0x431500 <= o[1] < 0x432b80):
                  continue
              state_sites.append((o[1],i,lines[max(o[0],i-15):min(len(lines),i+25)]))

          # Direct calls/branches to the three named local function starts.
          targets={0x431744:"candidate_add_new_client",0x431b04:"update_client_info_to_hash_table",
                   0x432780:"device_client_offline_check"}
          callers=[]
          for i,l in enumerate(lines):
              for addr,name in targets.items():
                  if re.search(rf'\b(?:jal|bal|j)\s+0*{addr:x}\b',l,re.I):
                      o=owner(i)
                      callers.append((addr,name,o,i,lines[max(o[0] if o else 0,i-18):min(len(lines),i+28)]))

          # Dynamic symbols around exported upload/init routines.
          dyn=[]
          for l in symtxt.splitlines():
              if re.search(r'confctl_device_list|client|offline|online',l,re.I):
                  dyn.append(l)

          with out.open("w",encoding="utf-8") as o:
              o.write("===== RUN 150: client online refresh pipeline =====\n")
              o.write("Resolved before this run: HostInfo.online = client_status[+0x84]; last_seen candidate = +0x88; offline threshold = 45 s.\n\n")

              o.write("===== DYNAMIC SYMBOLS =====\n")
              o.write("\n".join(dyn)+"\n\n")

              o.write("===== STRIPPED LOCAL FUNCTIONS 0x431500..0x432b80 =====\n")
              for a,names,b in named:
                  o.write(f"\n--- 0x{a:08x} names={','.join(names) if names else '?'} ---\n")
                  # Full dump only for relevant/named functions or those touching online/last_seen.
                  joined="\n".join(b)
                  if names or re.search(r'\b(?:lbu|sb|lw|sw)\s+[^,]+,(132|136)\([^)]+\)',joined,re.I):
                      o.write(joined+"\n")

              o.write("\n===== ONLINE/LAST_SEEN ACCESS SITES =====\n")
              seen=set()
              for a,i,ctx in state_sites:
                  key=(a,i)
                  if key in seen: continue
                  seen.add(key)
                  o.write(f"\n--- owner 0x{a:08x} ---\n")
                  o.write("\n".join(ctx)+"\n")

              o.write("\n===== DIRECT CALLERS OF KEY LOCAL FUNCTIONS =====\n")
              if not callers:
                  o.write("No direct jal/bal/j references; calls may use PIC GOT/jalr.\n")
              for addr,name,ow,i,ctx in callers:
                  o.write(f"\n--- target 0x{addr:08x} {name}; caller={('0x%08x'%ow[1]) if ow else '?'} ---\n")
                  o.write("\n".join(ctx)+"\n")

              o.write("\n===== EXPORTED confctl_device_list_upload BODY =====\n")
              m=re.search(r'\b([0-9a-fA-F]+)\s+\d+\s+FUNC\s+GLOBAL\s+DEFAULT\s+\d+\s+confctl_device_list_upload(?:@@Base)?',symtxt)
              if m:
                  a=int(m.group(1),16)
                  st,en=block_for_addr(a)
                  o.write(f"symbol address=0x{a:x}\n")
                  if st is not None:o.write("\n".join(lines[st:en])+"\n")
              else:
                  # readelf formatting varies; report matching line(s) above and raw
                  # disassembly around known 0x4324c8..0x432b00.
                  o.write("symbol parser did not resolve address; dumping known containing region\n")
                  for l in lines:
                      mm=re.match(r'^\s*([0-9a-fA-F]+):',l)
                      if mm and 0x432400 <= int(mm.group(1),16) < 0x432b80:
                          o.write(l+"\n")

              o.write("\n===== STATIC CONCLUSIONS =====\n")
              o.write("Expected identities to verify from __FUNCTION__ xrefs:\n")
              o.write("  0x431b04 -> update_client_info_to_hash_table\n")
              o.write("  0x432780 -> device_client_offline_check\n")
              o.write("  0x431744 -> likely add_new_client_to_hash_table if 0x31a0 xref is present\n")
              o.write("Both add/update paths should set online=1 and last_seen=now; watchdog clears online after >=45 s without refresh.\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: run150-client-online-refresh-pipeline
          path: docs/reverse-generated/run150-client-online-refresh-pipeline.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run150-client-online-refresh-pipeline.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: resolve client online refresh pipeline'
            git push
          fi
