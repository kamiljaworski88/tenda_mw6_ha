name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git xz-utils python3-pip
          python3 -m pip install --break-system-packages vmlinux-to-elf

      - name: Disassemble online_ip kernel pipeline
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated /tmp/mw6kernel
          img='firmware-src/image-unpacked-as-per-mtd/30_KernelFS'
          raw='/tmp/mw6kernel/kernel.raw'
          elf='/tmp/mw6kernel/kernel.elf'
          out='docs/reverse-generated/run123-online-ip-kernel-pipeline.txt'

          dd if="$img" of=/tmp/mw6kernel/kernel.lzma bs=1 skip=$((0x2818)) status=none
          xz --format=lzma -dc /tmp/mw6kernel/kernel.lzma > "$raw" || true
          test -s "$raw"
          vmlinux-to-elf "$raw" "$elf" >/tmp/mw6kernel/v2e.log 2>&1
          test -s "$elf"

          {
            echo '===== RUN 123: online_ip kernel pipeline ====='
            echo
            echo '===== TARGET SYMBOLS ====='
            mipsel-linux-gnu-nm -n "$elf" | grep -E ' (init_online_ip|statistic_rcv|get_online_ip_info|__statistic_rcv|add_online_ip|online_ip_timeout|clear_online_ip_flag|set_online_ip_flag|online_ip_count|online_ip_hash|online_ip_hash_size|online_ip_lock)$' || true
            echo
            echo '===== COMPLETE DISASSEMBLY 0x803d3300..0x803d4600 ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x803d3300 --stop-address=0x803d4600 "$elf" || true
            echo
            echo '===== DATA SYMBOLS NEAR online_ip GLOBALS ====='
            mipsel-linux-gnu-nm -n "$elf" | awk '$1 >= "81a1f000" && $1 <= "81a21000" {print}' || true
            echo
            echo '===== ONLINE_IP / STATISTIC STRINGS ====='
            strings -a -t x "$raw" | grep -Ei 'online_ip|statistic_rcv|get_online_ip|add_online_ip|netlink buff|online ip data|online ip max|timeout' || true
          } > "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: run123-online-ip-kernel-pipeline
          path: docs/reverse-generated/run123-online-ip-kernel-pipeline.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run123-online-ip-kernel-pipeline.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: disassemble online_ip kernel pipeline'
            git push
          fi
