name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Map SYS module and basic info command
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          lib='firmware-src/RootFS-unpacked/lib/libucapi.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/sys-module-map.txt'
          {
            echo '===== RUN 48 GOAL ====='
            echo 'Resolve module ID and command ID for uc_api_enable_m_sys / sys_basic_info.'
            echo '===== SYS ENABLE DISASSEMBLY ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x69e4 --stop-address=0x6b84 "$lib" || true
            echo '===== SYS HANDLER SYMBOLS ====='
            mipsel-linux-gnu-readelf -sW "$lib" | grep -E 'uc_api_(enable_m_sys|lib_sys_.*hdl_reg)' || true
            echo '===== SYS/BASIC COMMAND STRINGS ====='
            strings -a -t x "$lib" | grep -E 'M_MESH_BASIC|CMD_MESH_BASIC|SysBasic|BasicInfo|BasicInfo|GetSys|SysInfo' || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: sys-module-map
          path: docs/reverse-generated/sys-module-map.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/sys-module-map.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add SYS module map'; git push || true; fi
