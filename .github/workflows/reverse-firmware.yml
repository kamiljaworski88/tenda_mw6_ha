name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git xz-utils python3-pip
          python3 -m pip install --break-system-packages vmlinux-to-elf

      - name: Identify skb offset 0x78
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated /tmp/mw6kernel
          img='firmware-src/image-unpacked-as-per-mtd/30_KernelFS'
          raw='/tmp/mw6kernel/kernel.raw'
          elf='/tmp/mw6kernel/kernel.elf'
          out='docs/reverse-generated/run140-skb-offset-78-identity.txt'

          dd if="$img" of=/tmp/mw6kernel/kernel.lzma bs=1 skip=$((0x2818)) status=none
          xz --format=lzma -dc /tmp/mw6kernel/kernel.lzma > "$raw" || true
          test -s "$raw"
          vmlinux-to-elf "$raw" "$elf" >/tmp/mw6kernel/v2e.log 2>&1

          python3 - "$elf" "$out" <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          elf=Path(sys.argv[1]); out=Path(sys.argv[2])

          def run(cmd):
              return subprocess.run(cmd,text=True,errors='replace',
                                    stdout=subprocess.PIPE,stderr=subprocess.STDOUT).stdout

          nm=run(["mipsel-linux-gnu-nm","-n",str(elf)])
          syms=[]
          for l in nm.splitlines():
              p=l.split(maxsplit=2)
              if len(p)==3:
                  try: a=int(p[0],16)
                  except: continue
                  syms.append((a,p[1],p[2]))
          syms.sort()

          def dump_symbol(name, span=0x1000):
              matches=[x for x in syms if x[2]==name]
              if not matches:
                  return f"===== {name}: NOT FOUND =====\n"
              a,t,n=matches[0]
              nxt=a+span
              for aa,tt,nn in syms:
                  if aa>a:
                      nxt=min(nxt,aa)
                      break
              return (f"===== {name} @ 0x{a:x} =====\n"+
                      run(["mipsel-linux-gnu-objdump","-drwC",
                           f"--start-address=0x{a:x}",f"--stop-address=0x{nxt:x}",str(elf)]))

          all_dis=run(["mipsel-linux-gnu-objdump","-drwC",str(elf)])
          lines=all_dis.splitlines()

          with out.open("w",encoding="utf-8") as o:
              o.write("===== RUN 140: identify sk_buff +0x78 =====\n")
              o.write("Known MW6 anchors from disassembly: skb+0x50=len, skb+0xcc=data, candidate direction word at +0x78.\n")
              o.write("Kernel: Linux 3.10.90 / RTL8197F / Realtek SDK v3.4.11B.\n\n")

              for n in [
                  "__skb_get_rxhash",
                  "skb_get_rxhash",
                  "get_rps_cpu",
                  "set_rps_cpu",
                  "skb_flow_dissect",
                  "eth_type_trans",
                  "__alloc_skb",
                  "skb_clone",
                  "skb_copy",
                  "__pskb_copy"
              ]:
                  o.write(dump_symbol(n))
                  o.write("\n")

              o.write("===== SYMBOLS CONTAINING HASH/RPS/FLOW =====\n")
              for a,t,n in syms:
                  if re.search(r'rxhash|hash|rps|flow_dissect|skb.*hash',n,re.I):
                      o.write(f"0x{a:08x} {t} {n}\n")

              o.write("\n===== ALL +0x78 ACCESSES IN HASH/RPS/FLOW FUNCTIONS =====\n")
              current=None
              for i,l in enumerate(lines):
                  fm=re.match(r'^([0-9a-fA-F]+) <([^>]+)>:',l)
                  if fm: current=(int(fm.group(1),16),fm.group(2))
                  if not current: continue
                  if re.search(r'hash|rps|flow|skb',current[1],re.I) and re.search(r'\b(?:lw|sw)\s+[^,]+,120\([^)]+\)',l):
                      o.write(f"\n--- 0x{current[0]:08x} <{current[1]}> ---\n")
                      o.write("\n".join(lines[max(0,i-12):min(len(lines),i+18)])+"\n")

              o.write("\n===== VALIDATION ANCHORS =====\n")
              # Find candidate functions that touch both known skb anchors and +0x78.
              funcs=[]
              for i,l in enumerate(lines):
                  fm=re.match(r'^([0-9a-fA-F]+) <([^>]+)>:',l)
                  if fm: funcs.append((i,int(fm.group(1),16),fm.group(2)))
              for fi,(st,a,n) in enumerate(funcs):
                  en=funcs[fi+1][0] if fi+1<len(funcs) else len(lines)
                  b="\n".join(lines[st:en])
                  has50=bool(re.search(r'\b(?:lw|sw)\s+[^,]+,80\([^)]+\)',b))
                  has78=bool(re.search(r'\b(?:lw|sw)\s+[^,]+,120\([^)]+\)',b))
                  hascc=bool(re.search(r'\b(?:lw|sw)\s+[^,]+,204\([^)]+\)',b))
                  if has78 and (has50 or hascc):
                      o.write(f"0x{a:08x} <{n}> anchors: len={has50} +0x78={has78} data={hascc}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: run140-skb-offset-78-identity
          path: docs/reverse-generated/run140-skb-offset-78-identity.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run140-skb-offset-78-identity.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: identify skb offset 0x78'
            git push
          fi
