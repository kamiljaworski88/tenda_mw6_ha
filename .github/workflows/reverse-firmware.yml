name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Trace traffic input function at 0x50820
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          lib='firmware-src/RootFS-unpacked/lib/libcloud.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/traffic-input-50820.txt'
          {
            echo '===== RUN 82 GOAL ====='
            echo 'Identify function 0x50820 and inspect how it prepares data before dev_traffic_upload_json_packer.'
            echo '===== SYMBOL AT / AROUND 0x50820 ====='
            mipsel-linux-gnu-readelf -sW "$lib" | grep -Ei '50820|traffic|host|rate|stat' || true
            echo '===== DISASSEMBLY 0x50820..0x509a0 ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x50820 --stop-address=0x509a0 "$lib" || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: traffic-input-50820
          path: docs/reverse-generated/traffic-input-50820.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/traffic-input-50820.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add 0x50820 traffic-input trace'; git push || true; fi
