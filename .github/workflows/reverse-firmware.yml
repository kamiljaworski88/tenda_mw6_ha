name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3-pip
          python3 -m pip install --break-system-packages pyelftools
      - name: Read wan_port_rate descriptor
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
          python3 - <<'PY' > docs/reverse-generated/run161-wan-port-rate-schema.txt
          import struct
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          p=Path('firmware-src/RootFS-unpacked/lib/libpb.so')
          f=p.open('rb'); e=ELFFile(f)
          def read(a,n):
              for s in e.iter_sections():
                  va=int(s['sh_addr']); z=int(s['sh_size'])
                  if va<=a and a+n<=va+z:return s.data()[a-va:a-va+n]
              raise KeyError(hex(a))
          def u32(a):return struct.unpack('<I',read(a,4))[0]
          def cstr(a):
              b=bytearray()
              for i in range(128):
                  x=read(a+i,1)[0]
                  if not x:break
                  b.append(x)
              return b.decode(errors='replace')
          desc=0x3fd84
          w=[u32(desc+4*i) for i in range(12)]
          print('===== RUN 161: wan_port_rate schema =====')
          print('descriptor',hex(desc),'name',cstr(w[1]),'sizeof',w[5],'n_fields',w[6],'fields',hex(w[7]))
          for i in range(w[6]):
              a=w[7]+i*48
              q=[u32(a+4*j) for j in range(12)]
              print(f"id={q[1]} name={cstr(q[0])} label={q[2]} type={q[3]} quant=0x{q[4]:x} offset=0x{q[5]:x} descriptor=0x{q[6]:x} flags=0x{q[8]:x}")
          f.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: run161-wan-port-rate-schema
          path: docs/reverse-generated/run161-wan-port-rate-schema.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run161-wan-port-rate-schema.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: resolve WAN port rate schema'
            git push
          fi
