name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Trace next upload_statistics call
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          lib='firmware-src/RootFS-unpacked/lib/libcloud.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/upload-statistics-next-call.txt'
          {
            echo '===== RUN 75 GOAL ====='
            echo 'Disassemble upload_statistics after the initial memcpy and identify the next indirect call/GOT load.'
            echo '===== UPLOAD_STATISTICS WINDOW 0x211c0..0x212a0 ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x211c0 --stop-address=0x212a0 "$lib" || true
            echo '===== GOT / STUB HELPERS ====='
            mipsel-linux-gnu-readelf -SW "$lib" | grep -E '\.got|\.MIPS\.stubs|\.text' || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: upload-statistics-next-call
          path: docs/reverse-generated/upload-statistics-next-call.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/upload-statistics-next-call.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add upload_statistics next-call report'; git push || true; fi
