name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git xz-utils file python3-pip
          python3 -m pip install --break-system-packages vmlinux-to-elf || true

      - name: Extract kernel and locate statistics handler
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated /tmp/mw6kernel
          img='firmware-src/image-unpacked-as-per-mtd/30_KernelFS'
          out='docs/reverse-generated/run122-kernel-statistics.txt'
          raw='/tmp/mw6kernel/kernel.raw'
          elf='/tmp/mw6kernel/kernel.elf'

          # README/binwalk: LZMA stream starts at flash 0x32818; KernelFS starts at 0x30000.
          dd if="$img" of=/tmp/mw6kernel/kernel.lzma bs=1 skip=$((0x2818)) status=none
          xz --format=lzma -dc /tmp/mw6kernel/kernel.lzma > "$raw" || true

          {
            echo '===== RUN 122: built-in kernel statistics handler ====='
            echo 'KernelFS LZMA relative offset: 0x2818'
            echo
            echo '===== FILE TYPES / SIZES ====='
            file "$img" /tmp/mw6kernel/kernel.lzma "$raw" || true
            wc -c "$img" /tmp/mw6kernel/kernel.lzma "$raw" || true
            echo
            echo '===== RAW KERNEL RELEVANT STRINGS ====='
            strings -a -t x "$raw" | grep -Ei 'online_ip_hash|online_ip|netlink|statistic|traffic|up_bytes|down_bytes|clear_online|client.*stat|hw_nat|sw_nat|fastpath' | head -n 1000 || true
            echo
            echo '===== RAW STRING OFFSETS ====='
            grep -aob 'online_ip_hash' "$raw" || true
            grep -aob 'online_ip_hash_size' "$raw" || true
            grep -aob 'clear_online_ip_flag' "$raw" || true
            grep -aob 'netlink' "$raw" | head -n 100 || true
            echo
            echo '===== VMLINUX-TO-ELF ====='
            if command -v vmlinux-to-elf >/dev/null 2>&1; then
              vmlinux-to-elf "$raw" "$elf" 2>&1 || true
            elif command -v vmlinux_to_elf >/dev/null 2>&1; then
              vmlinux_to_elf "$raw" "$elf" 2>&1 || true
            else
              echo 'vmlinux-to-elf command unavailable'
            fi
            if [ -s "$elf" ]; then
              file "$elf" || true
              echo '-- symbols --'
              mipsel-linux-gnu-nm -n "$elf" 2>/dev/null | grep -Ei 'online_ip_hash|online_ip|netlink|statistic|traffic|clear_online|ip_info' | head -n 1000 || true
              echo '-- target symbol neighborhoods --'
              for sym in online_ip_hash online_ip_hash_size clear_online_ip_flag; do
                addr=$(mipsel-linux-gnu-nm -n "$elf" 2>/dev/null | awk -v s="$sym" '$3==s {print $1; exit}')
                if [ -n "$addr" ]; then
                  start=$((16#$addr > 512 ? 16#$addr - 512 : 0))
                  stop=$((16#$addr + 1024))
                  echo "### $sym @ 0x$addr"
                  mipsel-linux-gnu-objdump -drwC --start-address="$start" --stop-address="$stop" "$elf" 2>/dev/null || true
                fi
              done
            else
              echo 'No reconstructed ELF; raw kernel still retained only inside runner.'
            fi
          } > "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: run122-kernel-statistics
          path: docs/reverse-generated/run122-kernel-statistics.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run122-kernel-statistics.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: extract built-in kernel statistics handler'
            git push
          fi
