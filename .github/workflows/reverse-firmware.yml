name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git xz-utils python3-pip
          python3 -m pip install --break-system-packages vmlinux-to-elf

      - name: Trace online_ip detach and lifetime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated /tmp/mw6kernel
          img='firmware-src/image-unpacked-as-per-mtd/30_KernelFS'
          raw='/tmp/mw6kernel/kernel.raw'
          elf='/tmp/mw6kernel/kernel.elf'
          out='docs/reverse-generated/run146-onlineip-lifetime.txt'

          dd if="$img" of=/tmp/mw6kernel/kernel.lzma bs=1 skip=$((0x2818)) status=none
          xz --format=lzma -dc /tmp/mw6kernel/kernel.lzma > "$raw" || true
          test -s "$raw"
          vmlinux-to-elf "$raw" "$elf" >/tmp/mw6kernel/v2e.log 2>&1
          mipsel-linux-gnu-objdump -drwC "$elf" > /tmp/mw6kernel/kernel.dis

          python3 - "$elf" /tmp/mw6kernel/kernel.dis "$out" <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          elf=Path(sys.argv[1])
          lines=Path(sys.argv[2]).read_text(errors='replace').splitlines()
          out=Path(sys.argv[3])

          funcs=[]
          for i,l in enumerate(lines):
              m=re.match(r'^([0-9a-fA-F]+) <([^>]+)>:',l)
              if m: funcs.append((i,int(m.group(1),16),m.group(2)))

          def block(name):
              for idx,(st,a,n) in enumerate(funcs):
                  if n==name:
                      en=funcs[idx+1][0] if idx+1<len(funcs) else len(lines)
                      return a, lines[st:en]
              return None, []

          names=[
              "destroy_conntrack",
              "nf_conntrack_free",
              "nf_conntrack_destroy",
              "nf_ct_delete_from_lists",
              "nf_ct_dying_timeout",
              "rtl_nf_conntrack_destroy_hooks",
              "rtl_nf_conntrack_death_by_timeout_hooks",
              "online_ip_timeout",
              "add_online_ip",
          ]

          with out.open("w",encoding="utf-8") as o:
              o.write("===== RUN 146: online_ip lifetime and conntrack detach =====\n")
              o.write("Goal: prove how ct+0x8c is detached and how online_ip+0x08/list ownership controls record lifetime.\n\n")

              for n in names:
                  a,b=block(n)
                  o.write(f"===== {n} @ {('0x%x'%a) if a is not None else 'NOT FOUND'} =====\n")
                  if b:o.write("\n".join(b)+"\n")
                  o.write("\n")

              o.write("===== FOCUSED +0x8c CONNTRACK / +0x08 ONLINE_IP PATTERNS =====\n")
              for idx,(st,a,n) in enumerate(funcs):
                  en=funcs[idx+1][0] if idx+1<len(funcs) else len(lines)
                  b=lines[st:en]
                  joined="\n".join(b)
                  if not re.search(r'conntrack|online_ip|destroy|timeout|free',n,re.I):
                      continue
                  hits=[]
                  for j,l in enumerate(b):
                      if (re.search(r'\b(?:lw|sw)\s+[^,]+,140\([^)]+\)',l) or
                          re.search(r'\b(?:lw|sw)\s+[^,]+,8\([^)]+\)',l) or
                          re.search(r'\b(?:lw|sw)\s+[^,]+,(144|148)\([^)]+\)',l)):
                          hits.append(j)
                  if not hits:continue
                  o.write(f"\n--- 0x{a:08x} <{n}> ---\n")
                  seen=set()
                  for j in hits:
                      lo=max(0,j-15); hi=min(len(b),j+28)
                      key=(lo,hi)
                      if key in seen:continue
                      seen.add(key)
                      o.write("\n".join(b[lo:hi])+"\n...\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: run146-onlineip-lifetime
          path: docs/reverse-generated/run146-onlineip-lifetime.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run146-onlineip-lifetime.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: resolve online-ip lifetime'
            git push
          fi
