name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3-pip
          python3 -m pip install --break-system-packages pyelftools
      - name: Resolve device_list timer dispatch and publish channel
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated /tmp/run167
          dev='firmware-src/RootFS-unpacked/bin/device_list'
          out='docs/reverse-generated/run167-device-list-dispatch-channel.txt'

          python3 - "$dev" "$out" <<'PY'
          import re, subprocess, sys
          from pathlib import Path
          from elftools.elf.elffile import ELFFile

          dev=Path(sys.argv[1]); out=Path(sys.argv[2])

          def run(cmd):
              return subprocess.run(cmd,text=True,errors='replace',
                                    stdout=subprocess.PIPE,stderr=subprocess.STDOUT).stdout

          dis=run(["mipsel-linux-gnu-objdump","-drwC",str(dev)]).splitlines()
          abi=run(["mipsel-linux-gnu-readelf","-A",str(dev)])

          got={}
          for l in abi.splitlines():
              m=re.match(r'\s*([0-9a-fA-F]+)\s+(-?\d+)\(gp\)\s+([0-9a-fA-F]+)\s+[0-9a-fA-F]+\s+\S+\s+\S+\s+(.+)$',l)
              if m:
                  got[int(m.group(2))]=m.group(5).strip()

          funcs=[]
          for i,l in enumerate(dis):
              m=re.match(r'^([0-9a-fA-F]+) <([^>]+)>:',l)
              if m: funcs.append((i,int(m.group(1),16),m.group(2)))
          starts=[]
          for i,l in enumerate(dis):
              m=re.match(r'^\s*([0-9a-fA-F]+):\s+.*\blui\s+gp,',l)
              if not m: continue
              nxt='\n'.join(dis[i:min(len(dis),i+8)])
              if re.search(r'\baddu\s+gp,gp,t9',nxt) and re.search(r'\baddiu\s+sp,sp,-',nxt):
                  starts.append((i,int(m.group(1),16)))
          starts=sorted(starts)

          def slice_addr(start,stop):
              outl=[]; active=False
              for l in dis:
                  m=re.match(r'^\s*([0-9a-fA-F]+):',l)
                  if m:
                      a=int(m.group(1),16)
                      if start<=a<stop: active=True
                      elif active and a>=stop: break
                  if active: outl.append(l)
              return outl

          dispatch=slice_addr(0x404bd0,0x405150)
          start_timer=slice_addr(0x403940,0x403a50)
          upload=slice_addr(0x40bb84,0x40bfd4)

          def annotate(block):
              ann=[]
              for i,l in enumerate(block):
                  m=re.search(r'\blw\s+v0,(-?\d+)\(gp\)',l)
                  if not m: continue
                  off=int(m.group(1))
                  sym=got.get(off)
                  near='\n'.join(block[i:min(len(block),i+5)])
                  if sym and 'jalr' in near:
                      ann.append((i,off,sym,block[max(0,i-6):min(len(block),i+8)]))
              return ann

          with dev.open('rb') as f:
              ef=ELFFile(f)
              def read_va(addr,n):
                  for sec in ef.iter_sections():
                      va=int(sec['sh_addr']); z=int(sec['sh_size'])
                      if va<=addr and addr+n<=va+z:
                          return sec.data()[addr-va:addr-va+n],sec.name
                  raise KeyError(hex(addr))
              raw,sec=read_va(0x4103b0,0x80)

          mini=[]
          base=0x4103b0
          p=0
          while p<len(raw):
              q=p
              while q<len(raw) and 32<=raw[q]<127:q+=1
              if q>p and q<len(raw) and raw[q]==0:
                  mini.append((base+p,raw[p:q].decode('ascii','replace')))
                  p=q+1
              else:
                  p+=1

          branch_ctx=[]
          for i,l in enumerate(dispatch):
              if re.search(r'\bli\s+v1,(?:3|4)\b',l):
                  branch_ctx.append((i,dispatch[max(0,i-12):min(len(dispatch),i+70)]))

          with out.open('w',encoding='utf-8') as o:
              o.write('===== RUN 167: device_list timer dispatch + publish channel =====\n\n')

              o.write('===== RODATA 0x4103b0..0x410430 =====\n')
              o.write(f'section={sec}\nhex={raw.hex(" ")}\n')
              for a,s in mini:o.write(f'0x{a:08x}: {s!r}\n')

              o.write('\n===== start_device_list_timer =====\n')
              o.write('\n'.join(start_timer)+'\n')
              o.write('\n--- annotated calls ---\n')
              for i,off,sym,ctx in annotate(start_timer):
                  o.write(f'GOT {off}(gp) -> {sym}\n'+'\n'.join(ctx)+'\n---\n')

              o.write('\n===== TIMER/EVENT DISPATCH 0x404bd0..0x405150 =====\n')
              o.write('\n'.join(dispatch)+'\n')
              o.write('\n--- annotated calls ---\n')
              for i,off,sym,ctx in annotate(dispatch):
                  o.write(f'GOT {off}(gp) -> {sym}\n'+'\n'.join(ctx)+'\n---\n')

              o.write('\n===== ID 3 / ID 4 BRANCH CONTEXTS =====\n')
              for i,ctx in branch_ctx:
                  o.write('\n---\n'+'\n'.join(ctx)+'\n')

              o.write('\n===== do_upload_client_list TAIL / PUBLISH =====\n')
              o.write('\n'.join(upload[-120:])+'\n')
              o.write('\n--- annotated calls ---\n')
              for i,off,sym,ctx in annotate(upload):
                  if sym and re.search(r'cmd_pub|memcpy|free|malloc|time',sym,re.I):
                      o.write(f'GOT {off}(gp) -> {sym}\n'+'\n'.join(ctx)+'\n---\n')

              o.write('\n===== STATIC EXPECTATION TO VERIFY =====\n')
              o.write('timer id 3 should dispatch timeout check; timer id 4 should dispatch client-list upload.\n')
              o.write('publish key at 0x4103d4 is expected to be confctl_srv_key; command embedded in payload is device_list_upload.\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: run167-device-list-dispatch-channel
          path: docs/reverse-generated/run167-device-list-dispatch-channel.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run167-device-list-dispatch-channel.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: resolve device-list timer dispatch channel'
            git push
          fi
