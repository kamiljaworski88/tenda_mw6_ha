name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reverse-firmware.yml'

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install reverse tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3
      - name: Fetch firmware dump
        run: |
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p reports docs/reverse-generated
      - name: Disassemble client/cloud stack
        run: |
          root='firmware-src/RootFS-unpacked'
          for f in "$root/lib/libcommon.so" "$root/lib/libcloud.so" "$root/lib/libucapi.so" "$root/lib/libpb.so" "$root/bin/device_list" "$root/bin/confsrv" "$root/bin/ucloud"; do
            [ -f "$f" ] || continue
            safe=$(echo "${f#$root/}" | tr '/' '_')
            mipsel-linux-gnu-readelf -aW "$f" > "reports/$safe.readelf.txt" 2>&1 || true
            mipsel-linux-gnu-objdump -drwC "$f" > "reports/$safe.objdump.txt" 2>&1 || true
            strings -a -t x "$f" > "reports/$safe.strings.txt" || true
          done
      - name: Build compact client API map
        run: |
          out='docs/reverse-generated/client-api-map.txt'
          : > "$out"
          echo '# Auto-generated MW6 client/cloud API map' >> "$out"
          echo '# Source: public MW6 firmware dump; generated by GitHub Actions' >> "$out"
          echo >> "$out"
          for f in reports/*.strings.txt; do
            echo "===== $f : strings =====" >> "$out"
            grep -iE -C 6 'device_list_upload|rqst_client_hostname|rsp_client_hostname|fill_cloud_info_device_lists_rate|fill_cloud_info_device_upload_all|send_dev_device|DEV_UPLOAD_DEVIC|DEV_UPLOAD_STATU|M_CLOUD_INFO|cloud_info|online_ip|g_ip_info|host.*rate|upload.*device|device.*upload' "$f" >> "$out" || true
          done
          for f in reports/*.readelf.txt; do
            echo "===== $f : symbols =====" >> "$out"
            grep -iE 'device|client|cloud|rate|online_ip|statistic|ucapi|send_dev' "$f" >> "$out" || true
          done
          echo '===== confsrv focused disassembly =====' >> "$out"
          grep -n -B60 -A220 -E '<confctl_device_list_upload|<confctl_rqst_client_hostname|fill_cloud_info_device_lists_rate|fill_cloud_info_device_upload_all|send_dev_device' reports/bin_confsrv.objdump.txt >> "$out" || true
          echo '===== libucapi focused disassembly =====' >> "$out"
          grep -n -B50 -A180 -iE 'send_dev_device|cloud_info|device' reports/lib_libucapi.so.objdump.txt >> "$out" || true
          echo '===== libcloud focused disassembly =====' >> "$out"
          grep -n -B50 -A180 -iE 'send_dev_device|cloud_info|device' reports/lib_libcloud.so.objdump.txt >> "$out" || true
          # Keep the committed map bounded so the GitHub contents API can return it easily.
          head -c 850000 "$out" > "$out.tmp" && mv "$out.tmp" "$out"
      - name: Commit compact map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/client-api-map.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: refresh generated client API map'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mw6-client-cloud-reverse-reports
          path: reports/
          retention-days: 14
