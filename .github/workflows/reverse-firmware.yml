name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reverse-firmware.yml'
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3
      - name: Fetch firmware tree
        run: |
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
      - name: Map HostInfo protobuf and rate fields
        shell: bash
        run: |
          set -u
          root='firmware-src/RootFS-unpacked'
          out='docs/reverse-generated/hostinfo-rate-map.txt'
          : > "$out"
          echo '===== firmware references =====' >> "$out"
          grep -RInaE 'GetHostList|CMD_MESH_HOSTS_GET|uprate|downrate|fill_host_lists_rate|fill_host_lists_info|host_info__descriptor|host_lists__descriptor' firmware-src 2>/dev/null | head -n 2500 >> "$out" || true
          echo '===== binaries with HostInfo/rate strings =====' >> "$out"
          find "$root" -maxdepth 2 -type f | while read -r f; do
            if strings -a "$f" 2>/dev/null | grep -qiE 'uprate|downrate|GetHostList|host_lists__descriptor|host_info__descriptor'; then
              echo "===== FILE $f =====" >> "$out"
              strings -a -t x "$f" | grep -iE -C 18 'uprate|downrate|GetHostList|host_lists|host_info|signal|assoc_sn|condtion_time|interface_name' >> "$out" || true
              mipsel-linux-gnu-readelf -sW "$f" 2>/dev/null | grep -iE 'fill_host|host_info|host_lists|rate|online_ip|statistic' >> "$out" || true
            fi
          done
          pb="$root/lib/libpb.so"
          if [ -f "$pb" ]; then
            echo '===== libpb symbols =====' >> "$out"
            mipsel-linux-gnu-readelf -sW "$pb" 2>/dev/null | grep -iE 'host_info|host_lists' >> "$out" || true
            echo '===== libpb descriptor strings =====' >> "$out"
            strings -a -t x "$pb" | grep -iE -C 35 'uprate|downrate|assoc_sn|condtion_time|interface_name|host_name|signal' >> "$out" || true
            for s in host_info__init host_info__get_packed_size host_info__pack host_info__unpack host_lists__init host_lists__pack; do
              echo "===== DISASM $s =====" >> "$out"
              mipsel-linux-gnu-objdump -drwC --disassemble="$s" "$pb" 2>/dev/null >> "$out" || true
            done
          fi
          conf="$root/bin/confsrv"
          if [ -f "$conf" ]; then
            echo '===== confsrv symbols =====' >> "$out"
            mipsel-linux-gnu-readelf -sW "$conf" 2>/dev/null | grep -iE 'fill_host|rate|online_ip|statistic' >> "$out" || true
            mipsel-linux-gnu-objdump -drwC "$conf" > /tmp/conf.objdump || true
            echo '===== confsrv rate-related disassembly excerpts =====' >> "$out"
            grep -iE -C 60 'fill_host_lists_rate|fill_host_lists_info|find_client_in_online_ip_info|netlink_get_statistic_info|g_ip_info|host_lists__pack' /tmp/conf.objdump 2>/dev/null | head -n 9000 >> "$out" || true
          fi
          echo '===== live observation =====' >> "$out"
          printf '%s\n' 'M_MESH_HOSTS[20]/CMD_MESH_HOSTS_GET[0] returned 30 HostInfo records.' >> "$out"
          printf '%s\n' 'Observed: f1 IP; f2 MAC; f3 0/1/2; f4 assoc_sn; f5 9074/9104; f6/f7/f8 zero; f9 negative RSSI when present; f10 hostname.' >> "$out"
          printf '%s\n' 'Goal: map exact protobuf names/numbers and prove uprate/downrate population path.' >> "$out"
          head -c 1800000 "$out" > /tmp/hostinfo.out
          mv /tmp/hostinfo.out "$out"
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/hostinfo-rate-map.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: refresh HostInfo protobuf and rate map'
            git push
          fi
