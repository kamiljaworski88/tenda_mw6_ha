name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3 python3-pip
          pip3 install pyelftools --break-system-packages
      - name: Resolve GetHostList GOT targets and rate gate
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          conf='firmware-src/RootFS-unpacked/bin/confsrv'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/rate-got-map.txt'
          mipsel-linux-gnu-objdump -drwC "$conf" > /tmp/conf.asm
          mipsel-linux-gnu-readelf -aW "$conf" > /tmp/conf.elf
          python3 <<'PY' > "$out"
from elftools.elf.elffile import ELFFile
import struct,re,subprocess
p='firmware-src/RootFS-unpacked/bin/confsrv'
with open(p,'rb') as f:
 e=ELFFile(f)
 print('===== ELF/GOT =====')
 for sec in e.iter_sections():
  if sec.name in ('.got','.got.plt'):
   print(sec.name, hex(sec['sh_addr']), hex(sec['sh_size']))
 print('===== DYNSYM targets =====')
 d=e.get_section_by_name('.dynsym')
 for s in d.iter_symbols():
  n=s.name.lower()
  if any(x in n for x in ['netlink_get_statistic_info','g_ip_info','host_lists','host_info','feature','debug']):
   print(hex(s['st_value']), s.name, s['st_shndx'])
print('===== GetHostList exact call sites =====')
asm=open('/tmp/conf.asm',errors='replace').read().splitlines()
for i,l in enumerate(asm):
 if re.search(r'^\s*435(1f8|228|2b4):',l):
  print('\nCALLSITE',l)
  for x in asm[max(0,i-10):i+6]: print(x)
print('\n===== all references to netlink/stat symbols =====')
for i,l in enumerate(asm):
 if 'netlink_get_statistic_info' in l or 'g_ip_info' in l:
  for x in asm[max(0,i-12):i+18]: print(x)
  print('---')
PY
          echo '===== readelf reloc/GOT context =====' >> "$out"
          grep -iE -B12 -A12 'netlink_get_statistic_info|g_ip_info' /tmp/conf.elf >> "$out" || true
          echo '===== GetHostList 0x4351d0-0x4352c0 =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC --start-address=0x4351d0 --stop-address=0x4352c0 "$conf" >> "$out"
          echo '===== candidate local functions by direct target neighborhoods =====' >> "$out"
          # Include nearby static routines around GetHostList and all callsites carrying HostLists pointer.
          grep -nE 'addiu[[:space:]]+a0,(s8|v0)|li[[:space:]]+a0,15|netlink_get_statistic_info|g_ip_info' /tmp/conf.asm | grep -E '43[0-9a-f]{4}:' | head -n 500 >> "$out" || true
          echo '===== rate/debug strings with offsets =====' >> "$out"
          strings -a -t x "$conf" | grep -iE -B12 -A24 'uprate|downrate|online_ip|fill_host|GetHostList|host list.*rate|statistic' >> "$out" || true
          head -c 1400000 "$out" > /tmp/cut && mv /tmp/cut "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: rate-got-map
          path: docs/reverse-generated/rate-got-map.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/rate-got-map.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: map GetHostList GOT rate path'; git push || true; fi
