name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3-pip
          python3 -m pip install --break-system-packages pyelftools

      - name: Resolve WAN traffic protobuf and handler
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
          pb='firmware-src/RootFS-unpacked/lib/libpb.so'
          conf='firmware-src/RootFS-unpacked/bin/confsrv'
          uc='firmware-src/RootFS-unpacked/lib/libucapi.so'
          out='docs/reverse-generated/run159-wan-traffic-schema.txt'

          python3 - "$pb" "$conf" "$uc" "$out" <<'PY'
          import re, struct, subprocess, sys
          from pathlib import Path
          from elftools.elf.elffile import ELFFile

          pb,conf,uc,out=map(Path,sys.argv[1:5])

          def run(cmd):
              return subprocess.run(cmd,text=True,errors='replace',
                                    stdout=subprocess.PIPE,stderr=subprocess.STDOUT).stdout

          def sym(path,name):
              txt=run(["mipsel-linux-gnu-readelf","-Ws",str(path)])
              for l in txt.splitlines():
                  p=l.split()
                  if len(p)>=8 and p[-1].split("@")[0]==name:
                      try:return int(p[1],16),int(p[2])
                      except:return None,None
              return None,None

          class Reader:
              def __init__(self,path):
                  self.f=path.open('rb'); self.e=ELFFile(self.f)
              def read(self,a,n):
                  for sec in self.e.iter_sections():
                      va=int(sec['sh_addr']); sz=int(sec['sh_size'])
                      if va<=a and a+n<=va+sz:
                          return sec.data()[a-va:a-va+n]
                  raise KeyError(hex(a))
              def u32(self,a): return struct.unpack("<I",self.read(a,4))[0]
              def cstr(self,a,n=128):
                  if not a:return ""
                  b=bytearray()
                  for i in range(n):
                      x=self.read(a+i,1)[0]
                      if not x:break
                      b.append(x)
                  return b.decode(errors="replace")
              def close(self):self.f.close()

          r=Reader(pb)
          desc,size=sym(pb,"wan_rate__descriptor")
          fields=[]
          if desc:
              words=[r.u32(desc+4*i) for i in range(12)]
              sizeof_msg=words[5]; nfields=words[6]; fa=words[7]
              for i in range(nfields):
                  a=fa+i*48
                  w=[r.u32(a+4*j) for j in range(12)]
                  fields.append({
                    "id":w[1],"name":r.cstr(w[0]),"label":w[2],"type":w[3],
                    "quant":w[4],"offset":w[5],"flags":w[8]
                  })
          else:
              sizeof_msg=nfields=fa=None

          # Strings and nearby disassembly for known rate routines.
          conf_strings=run(["strings","-tx",str(conf)])
          rate_strs=[l for l in conf_strings.splitlines()
                     if re.search(r'fill_router_wan_rate|get_router_wan_rate|fill_bridge_wan_rate|print_wan_rate|wan1\.(?:up|down)rate|GetTrafficInfo|TRAFFIC',l,re.I)]

          # Find __FUNCTION__ string VAs for local rate helpers and xrefs by low16.
          raw=conf.read_bytes()
          vas=[]
          with conf.open("rb") as f:
              ef=ELFFile(f)
              for lit in [b'fill_router_wan_rate',b'get_router_wan_rate',b'fill_bridge_wan_rate',b'print_wan_rate']:
                  pos=0
                  while True:
                      off=raw.find(lit,pos)
                      if off<0:break
                      va=None
                      for sec in ef.iter_sections():
                          so=int(sec['sh_offset']); sz=int(sec['sh_size'])
                          if so<=off<so+sz:
                              va=int(sec['sh_addr'])+(off-so);break
                      vas.append((lit.decode(),off,va))
                      pos=off+1

          dis=run(["mipsel-linux-gnu-objdump","-drwC",str(conf)]).splitlines()
          xrefs=[]
          for name,off,va in vas:
              if not va:continue
              lo=va&0xffff; signed=lo if lo<0x8000 else lo-0x10000
              for i,l in enumerate(dis):
                  if re.search(rf'\baddiu\s+[^,]+,[^,]+,(?:{signed}|0x{lo:x})\b',l,re.I):
                      xrefs.append((name,va,i,dis[max(0,i-35):min(len(dis),i+90)]))

          ucstrings=run(["strings","-tx",str(uc)])
          uc_rate=[l for l in ucstrings.splitlines()
                   if re.search(r'MESH_WAN|TRAFFIC|GetTrafficInfo|WAN_TRAFFIC|CMD_MESH_WAN',l,re.I)]

          with out.open("w",encoding="utf-8") as o:
              o.write("===== RUN 159: WAN GetTrafficInfo schema / handler =====\n\n")
              o.write(f"wan_rate__descriptor={hex(desc) if desc else 'NOT FOUND'} size={size}\n")
              o.write(f"sizeof_message={sizeof_msg} n_fields={nfields} fields={hex(fa) if fa else '?'}\n")
              o.write("\n===== WANRATE FIELD DESCRIPTORS =====\n")
              for f in fields:
                  o.write(f"id={f['id']} name={f['name']} offset=0x{f['offset']:x} quant=0x{f['quant']:x} type={f['type']} label={f['label']} flags=0x{f['flags']:x}\n")

              o.write("\n===== CONFSRV RATE STRINGS =====\n")
              o.write("\n".join(rate_strs)+"\n")

              o.write("\n===== RATE STRING XREFS =====\n")
              for name,va,i,ctx in xrefs:
                  o.write(f"\n--- {name} VA=0x{va:x} ---\n")
                  o.write("\n".join(ctx)+"\n")

              o.write("\n===== LIBUCAPI WAN/TRAFFIC STRINGS =====\n")
              o.write("\n".join(uc_rate)+"\n")

              o.write("\n===== WAN_RATE INIT/PACK SYMBOLS =====\n")
              for path in [pb,conf,uc]:
                  o.write(f"\n--- {path} ---\n")
                  sy=run(["mipsel-linux-gnu-readelf","-Ws",str(path)])
                  for l in sy.splitlines():
                      if re.search(r'wan_rate|traffic|get.*rate|interface_statistics|wan_statistics',l,re.I):
                          o.write(l+"\n")
          r.close()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: run159-wan-traffic-schema
          path: docs/reverse-generated/run159-wan-traffic-schema.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898218+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run159-wan-traffic-schema.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: resolve WAN traffic schema'
            git push
          fi
