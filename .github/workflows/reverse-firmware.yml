name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Resolve dev traffic producer call
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          lib='firmware-src/RootFS-unpacked/lib/libcloud.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/dev-traffic-a0-3-call.txt'
          {
            echo '===== RUN 84 GOAL ====='
            echo 'Resolve cmd_cloud_info_dev_traffic_upload call at 0x30b3c: lw t9,-32576(gp), gp=0x93370, GOT=0x8b430, called with a0=3.'
            echo '===== GOT BYTES AROUND 0x8b430 ====='
            mipsel-linux-gnu-objdump -s -j .got "$lib" | grep -Ei '^ 8b420|^ 8b430|^ 8b440|^ 8b450' || true
            echo '===== DYNSYM ====='
            mipsel-linux-gnu-readelf -sW "$lib" | nl -ba | sed -n '1,1700p' || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: dev-traffic-a0-3-call
          path: docs/reverse-generated/dev-traffic-a0-3-call.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/dev-traffic-a0-3-call.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add dev traffic a0=3 call report'; git push || true; fi
