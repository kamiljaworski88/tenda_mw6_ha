name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git

      - name: Locate protocol 31 kernel handler
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
          root='firmware-src/RootFS-unpacked/lib/modules'
          out='docs/reverse-generated/run121-netlink31-handler.txt'
          {
            echo '===== RUN 121: locate kernel owner of AF_NETLINK protocol 31 ====='
            echo
            find "$root" -type f -name '*.ko' -size +0c -print0 | while IFS= read -r -d '' f; do
              if mipsel-linux-gnu-nm -a "$f" 2>/dev/null | grep -q '__netlink_kernel_create'; then
                echo "===== MODULE $f ====="
                mipsel-linux-gnu-nm -a "$f" 2>/dev/null | grep -Ei 'netlink|online|stat|traffic|host|client|ip_info|hash|byte' || true
                echo '-- create contexts --'
                mipsel-linux-gnu-objdump -drwC "$f" 2>/dev/null | grep -n -B20 -A28 '__netlink_kernel_create' || true
                echo '-- immediate protocol candidates --'
                mipsel-linux-gnu-objdump -drwC "$f" 2>/dev/null | grep -n -E 'li[[:space:]]+a1,(31|0x1f)|2405001f' || true
                echo
              fi
            done
            echo '===== ALL MODULES WITH LITERAL protocol 31 NEAR netlink create ====='
            find "$root" -type f -name '*.ko' -size +0c -print0 | while IFS= read -r -d '' f; do
              d=$(mipsel-linux-gnu-objdump -drwC "$f" 2>/dev/null || true)
              if printf '%s\n' "$d" | grep -q '__netlink_kernel_create' && printf '%s\n' "$d" | grep -Eq 'li[[:space:]]+a1,(31|0x1f)|2405001f'; then
                echo "--- $f ---"
                printf '%s\n' "$d" | grep -n -B40 -A100 -E '__netlink_kernel_create|2405001f|li[[:space:]]+a1,(31|0x1f)' || true
                echo '-- symbols --'
                mipsel-linux-gnu-nm -a "$f" 2>/dev/null | sort || true
                echo '-- strings --'
                strings -a -t x "$f" | grep -Ei 'netlink|online|stat|traffic|host|client|ip_info|hash|byte|upload|download|nat' || true
                echo
              fi
            done
          } > "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: run121-netlink31-handler
          path: docs/reverse-generated/run121-netlink31-handler.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run121-netlink31-handler.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: locate netlink protocol 31 handler'
            git push
          fi
