name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Trace cloud sys basic registration
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          lib='firmware-src/RootFS-unpacked/lib/libucapi.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/sys-basic-enable-path.txt'
          {
            echo '===== RUN 59 GOAL ====='
            echo 'Trace enable_cloud_get_sys_basic and identify callbacks / data producer used for SYS BasicInfo.'
            echo '===== SYMBOLS ====='
            mipsel-linux-gnu-readelf -sW "$lib" | grep -E 'enable_cloud_get_sys_basic|uc_api_set_basic_info|sys_basic_info' || true
            echo '===== enable_cloud_get_sys_basic DISASSEMBLY ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0xa3fc --stop-address=0xa4c0 "$lib" || true
            echo '===== NEARBY RODATA STRINGS ====='
            strings -a -t x "$lib" | awk '$1 >= "1f000" && $1 <= "20500" {print}' | grep -Ei 'basic|serial|sys|model|soft|firmware|cloud' || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: sys-basic-enable-path
          path: docs/reverse-generated/sys-basic-enable-path.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/sys-basic-enable-path.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add SYS BasicInfo enable trace'; git push || true; fi
