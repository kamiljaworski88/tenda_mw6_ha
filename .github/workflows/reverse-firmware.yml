name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Resolve need_upload flag
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
          dev='firmware-src/RootFS-unpacked/bin/device_list'
          out='docs/reverse-generated/run170-need-upload-flag.txt'
          {
            echo '===== RUN 170: need_upload flag ====='
            echo
            echo '===== need_upload xref (0x40d373 / signed low16 -11405) ====='
            mipsel-linux-gnu-objdump -drwC "$dev" | grep -B50 -A80 -E 'd373|-11405' || true
            echo
            echo '===== GOT helper -32488 ====='
            mipsel-linux-gnu-readelf -A "$dev" | grep -E -- '-32488\(gp\)' || true
            echo
            echo '===== ALL obvious +96 accesses in client-related functions ====='
            mipsel-linux-gnu-objdump -drwC "$dev" | grep -B12 -A20 -E '\b(lw|sw|lbu|sb)[[:space:]]+[^,]+,96\(' || true
            echo
            echo '===== client hash functions ====='
            mipsel-linux-gnu-readelf -Ws "$dev" | grep -Ei 'client_hs|alloc_device_client|update.*client|add.*client|need_upload' || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: run170-need-upload-flag
          path: docs/reverse-generated/run170-need-upload-flag.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add docs/reverse-generated/run170-need-upload-flag.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: resolve need_upload flag'
            git push
          fi
