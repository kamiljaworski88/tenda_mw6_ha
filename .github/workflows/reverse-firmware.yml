name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git xz-utils python3-pip
          python3 -m pip install --break-system-packages vmlinux-to-elf

      - name: Trace online_ip creation gate
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated /tmp/mw6kernel
          img='firmware-src/image-unpacked-as-per-mtd/30_KernelFS'
          raw='/tmp/mw6kernel/kernel.raw'
          elf='/tmp/mw6kernel/kernel.elf'
          out='docs/reverse-generated/run136-onlineip-creation-gate.txt'

          dd if="$img" of=/tmp/mw6kernel/kernel.lzma bs=1 skip=$((0x2818)) status=none
          xz --format=lzma -dc /tmp/mw6kernel/kernel.lzma > "$raw" || true
          test -s "$raw"
          vmlinux-to-elf "$raw" "$elf" >/tmp/mw6kernel/v2e.log 2>&1

          {
            echo '===== RUN 136: online_ip creation gate ====='
            echo
            echo '===== SYMBOLS ====='
            mipsel-linux-gnu-nm -n "$elf" | grep -E 'check_ip_addr|find_online_ip|add_online_ip|nf_conntrack_in|online_ip|fastpath|skb|mark' || true

            echo
            echo '===== check_ip_addr + find_online_ip ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x803d2b80 --stop-address=0x803d2d80 "$elf"

            echo
            echo '===== nf_conntrack_in full relevant body ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x803bea80 --stop-address=0x803bf320 "$elf"

            echo
            echo '===== ALL DIRECT CALLS TO add_online_ip ====='
            mipsel-linux-gnu-objdump -d "$elf" | grep -B18 -A24 -E 'jal[[:space:]]+803d4190|<add_online_ip>' || true

            echo
            echo '===== KERNEL ACCESSES TO skb-ish offset +0x78 / decimal 120 NEAR CONNTRACK/FASTPATH ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x80380000 --stop-address=0x8045c000 "$elf" |
              grep -B8 -A12 -E '\b(lw|sw)[[:space:]].*,120\([^)]*\)|0x78\)' || true

            echo
            echo '===== MODULES IMPORTING add/find/check online_ip ====='
            find firmware-src -name '*.ko' -type f -print0 | while IFS= read -r -d '' ko; do
              hits="$(mipsel-linux-gnu-nm -u "$ko" 2>/dev/null | grep -E 'add_online_ip|find_online_ip|check_ip_addr|online_ip' || true)"
              if [ -n "$hits" ]; then
                echo "--- $ko ---"
                echo "$hits"
              fi
            done

            echo
            echo '===== LIBCOMMON STATISTIC CONFIG STRINGS / RODATA ====='
            lib='firmware-src/RootFS-unpacked/lib/libcommon.so'
            strings -tx "$lib" | grep -E -i 'statistic|online.?ip|ip.?info|max.*host|host.*max|netlink' || true
            echo
            echo '--- rodata around 0x5ab80 ---'
            mipsel-linux-gnu-objdump -s --start-address=0x5ab60 --stop-address=0x5ac40 "$lib" || true
          } > "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: run136-onlineip-creation-gate
          path: docs/reverse-generated/run136-onlineip-creation-gate.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run136-onlineip-creation-gate.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: trace online_ip creation gate'
            git push
          fi
