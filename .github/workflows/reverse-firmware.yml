name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3
      - name: Isolate ol_hosts handler and command table
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          uc='firmware-src/RootFS-unpacked/lib/libucapi.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/ol-hosts-handler.txt'
          mipsel-linux-gnu-objdump -drwC "$uc" > /tmp/uc.asm
          mipsel-linux-gnu-readelf -sW "$uc" > /tmp/uc.syms
          {
            echo '===== RUN 41 GOAL ====='
            echo 'Recover exact uc_api_lib_ol_hosts_get_hdl_reg registration, callback target, command IDs, and request send path for GetHostList.'
            echo '===== SYMBOLS ====='
            grep -iE 'ol_hosts|gethost|cmd_args|cmd_register|cmd_send|cmd_resp|enable_m_ol_host|net_send|cgi_send' /tmp/uc.syms || true
            echo '===== OL HOSTS REG FUNCTION ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x1af3c --stop-address=0x1b080 "$uc" || true
            echo '===== ENABLE M_OL_HOST ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x05ef4 --stop-address=0x06020 "$uc" || true
            echo '===== CMD REGISTER ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x0786c --stop-address=0x07c7c "$uc" || true
            echo '===== CMD SEND / RESP ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x05740 --stop-address=0x058a8 "$uc" || true
            mipsel-linux-gnu-objdump -drwC --start-address=0x07418 --stop-address=0x07454 "$uc" || true
            echo '===== COMMAND TABLE DATA AROUND cmd_args 0x31890 ====='
            mipsel-linux-gnu-objdump -s --start-address=0x31890 --stop-address=0x31f00 "$uc" || true
            echo '===== RODATA GetHostList REGION ====='
            mipsel-linux-gnu-objdump -s --start-address=0x1fbf0 --stop-address=0x1fd30 "$uc" || true
            echo '===== REFERENCES TO OL HOST REG / GET STRING REGION ====='
            grep -n -E -B60 -A100 '1af3c|1fc9c|1fca8|1fcb8|31890' /tmp/uc.asm | head -n 3000 || true
          } > "$out"
          head -c 2400000 "$out" > /tmp/cut && mv /tmp/cut "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: ol-hosts-handler
          path: docs/reverse-generated/ol-hosts-handler.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/ol-hosts-handler.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: isolate ol_hosts handler'; git push || true; fi
