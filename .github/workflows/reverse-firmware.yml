name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Resolve SYS command callbacks
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          lib='firmware-src/RootFS-unpacked/lib/libucapi.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/sys-command-callbacks.txt'
          {
            echo '===== RUN 49 GOAL ====='
            echo 'Resolve callback targets for M_SYS command IDs 0..4, especially cmd 0.'
            echo '===== KNOWN GP / GOT SLOTS FROM uc_api_enable_m_sys ====='
            echo 'GP=0x39ed0'
            echo 'cmd0 GOT=0x3200c (gp-32452)'
            echo 'cmd1 GOT=0x32098 (gp-32312)'
            echo 'cmd2 GOT=0x3221c (gp-31924)'
            echo 'cmd3 GOT=0x32188 (gp-32072)'
            echo 'cmd4 GOT=0x320f4 (gp-32220)'
            echo '===== RELOCATIONS FOR THESE GOT SLOTS ====='
            mipsel-linux-gnu-readelf -rW "$lib" | grep -Ei '0003200c|00032098|0003221c|00032188|000320f4|3200c|32098|3221c|32188|320f4' || true
            echo '===== GOT BYTES AROUND TARGET SLOTS ====='
            mipsel-linux-gnu-objdump -s -j .got --start-address=0x31ff0 --stop-address=0x32240 "$lib" || true
            echo '===== SYS HANDLER SYMBOL ADDRESSES ====='
            mipsel-linux-gnu-readelf -sW "$lib" | grep -E 'uc_api_lib_sys_(basic_info|advance_info|time_zone|reboot|reset)_hdl_reg' || true
            echo '===== ENABLE FUNCTION CHECK ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x6a60 --stop-address=0x6b64 "$lib" || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: sys-command-callbacks
          path: docs/reverse-generated/sys-command-callbacks.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/sys-command-callbacks.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add SYS command callback map'; git push || true; fi
