name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3
      - name: Resolve static host-rate functions
        shell: bash
        run: |
          set -u
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          root='firmware-src/RootFS-unpacked'; conf="$root/bin/confsrv"
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/rate-static-functions.txt'; : > "$out"
          mipsel-linux-gnu-objdump -drwC "$conf" > /tmp/conf.asm
          echo '===== GetHostList call window =====' >> "$out"
          sed -n '/00434f9c <confctl_get_host_list/,/00435420/p' /tmp/conf.asm >> "$out" || true
          echo '===== static function labels around candidate targets =====' >> "$out"
          grep -nE '^ *[0-9a-f]+ <|434f9c|4351f8|435228|4352b4|netlink_get_statistic_info|g_ip_info' /tmp/conf.asm | grep -B4 -A8 -E '4351|4352|netlink|get_statistic|g_ip_info|<T\.' >> "$out" || true
          echo '===== candidate target neighborhoods =====' >> "$out"
          # Calls inside GetHostList resolve through gp-relative local/static functions.
          # Dump broad neighborhoods around the three candidate stages seen at +0x260, +0x288 and +0x318.
          for range in '430000 438000' '440000 448000' '450000 458000'; do
            set -- $range
            echo "--- address range $1-$2 ---" >> "$out"
            mipsel-linux-gnu-objdump -drwC --start-address=0x$1 --stop-address=0x$2 "$conf" | grep -B18 -A80 -E 'netlink_get_statistic_info|g_ip_info|uprate|downrate' >> "$out" || true
          done
          echo '===== all GOT references to netlink_get_statistic_info/g_ip_info =====' >> "$out"
          mipsel-linux-gnu-readelf -aW "$conf" | grep -iE -B8 -A8 'netlink_get_statistic_info|g_ip_info' >> "$out" || true
          echo '===== strings rate context =====' >> "$out"
          strings -a -t x "$conf" | grep -iE -B20 -A30 'uprate|downrate|online_ip|statistic|GetTrafficInfo|host.*rate' >> "$out" || true
          python3 -c "from pathlib import Path; p=Path('$out'); p.write_text(p.read_bytes().decode('utf-8','backslashreplace'),encoding='utf-8')"
          head -c 1400000 "$out" > /tmp/cut && mv /tmp/cut "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: rate-static-functions
          path: docs/reverse-generated/rate-static-functions.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/rate-static-functions.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: map static host rate functions'; git push || true; fi
