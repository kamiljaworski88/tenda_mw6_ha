name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git

      - name: Identify helper 0x4087b8
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
          dev='firmware-src/RootFS-unpacked/bin/device_list'
          out='docs/reverse-generated/run156-wireless-arp-helper-4087b8.txt'

          {
            echo '===== RUN 156: identify get_all_wireless_client helper 0x4087b8 ====='
            echo
            echo '===== TARGET 0x4087b8 ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x408700 --stop-address=0x408b20 "$dev"

            echo
            echo '===== NEARBY SYMBOLS ====='
            mipsel-linux-gnu-nm -n "$dev" | awk '$1 >= "00408600" && $1 <= "00408c00" {print}' || true

            echo
            echo '===== STRING TABLE CLUES ====='
            strings -tx "$dev" | grep -Ei 'find_if_arp_in_arp_list_by_mac|get_proc_arp_list|arp_receive|/proc/net/arp|wifi_list|mac =|ip =' || true

            echo
            echo '===== GOT ====='
            mipsel-linux-gnu-readelf -A "$dev"
          } > "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: run156-wireless-arp-helper
          path: docs/reverse-generated/run156-wireless-arp-helper-4087b8.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run156-wireless-arp-helper-4087b8.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: identify wireless ARP helper'
            git push
          fi
