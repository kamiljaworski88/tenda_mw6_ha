name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3
      - name: Trace cmdsrv RPC routing
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          srv='firmware-src/RootFS-unpacked/sbin/cmdsrv'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/cmdsrv-rpc-routing.txt'
          mipsel-linux-gnu-objdump -drwC "$srv" > /tmp/srv.asm
          mipsel-linux-gnu-readelf -sW "$srv" > /tmp/srv.syms
          {
            echo '===== RUN 44 GOAL ====='
            echo 'Determine how cmdsrv routes subscriber vs request clients and whether cmdrpc@ keys/channels get a dedicated request/reply path that avoids global subscribe mode.'
            echo '===== SYMBOLS ====='
            grep -iE 'subscribe|unsubscribe|publish|redis|client|pending|request|reply|cmdrpc|reader|writer|accept|connect|close|execute|share|mode' /tmp/srv.syms | head -n 1200 || true
            echo '===== STRINGS ====='
            strings -a -t x "$srv" | grep -iE -B20 -A30 'only .*SUBSCRIBE|subscribe mode|subscribe|unsubscribe|publish|cmdrpc@|pending|request|reply|redis|share|client' || true
            echo '===== REFERENCES TO SUBSCRIBE-ONLY ERROR ====='
            off=$(strings -a -t x "$srv" | awk '/only .*SUBSCRIBE/ {print $1; exit}')
            echo "string_offset=${off:-none}"
            if [ -n "${off:-}" ]; then
              grep -n -E -B100 -A180 "${off}" /tmp/srv.asm | head -n 2200 || true
            fi
            echo '===== REDIS CLIENT EXECUTE / TRY EXECUTE ====='
            grep -n -E -B80 -A160 'redis_client_(try_)?execute|redis_reader|redis_writer|freeReplyObject' /tmp/srv.asm | head -n 3000 || true
            echo '===== ACCEPT / FRONTEND CLIENT LIFECYCLE ====='
            grep -n -E -B80 -A160 'accept|cm_io|client_new|client_free|close|pending' /tmp/srv.asm | head -n 3200 || true
            echo '===== FULL DYNAMIC RELOCS ====='
            mipsel-linux-gnu-objdump -R "$srv" || true
          } > "$out"
          head -c 3500000 "$out" > /tmp/cut && mv /tmp/cut "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: cmdsrv-rpc-routing
          path: docs/reverse-generated/cmdsrv-rpc-routing.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/cmdsrv-rpc-routing.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: trace cmdsrv rpc routing'; git push || true; fi
