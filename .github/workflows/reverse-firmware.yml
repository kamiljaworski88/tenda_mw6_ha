name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3

      - name: Trace NOS/TBQ online-ip accounting
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated /tmp/mw6
          moddir='firmware-src/RootFS-unpacked/lib/modules'
          out='docs/reverse-generated/run130-nos-tbq-accounting.txt'

          python3 - "$moddir" "$out" <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          moddir=Path(sys.argv[1]); out=Path(sys.argv[2])

          def sh(args):
              proc = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True, errors='replace', check=False)
              return proc.stdout

          def nm(path):
              return sh(['mipsel-linux-gnu-nm','-n',str(path)]).splitlines()

          def dis(path):
              return sh(['mipsel-linux-gnu-objdump','-drwC',str(path)]).splitlines()

          def funcs_from_dis(lines):
              fs=[]
              for i,l in enumerate(lines):
                  m=re.match(r'^([0-9a-fA-F]+) <([^>]+)>:',l)
                  if m: fs.append((i,int(m.group(1),16),m.group(2)))
              return fs

          def owner(funcs, idx):
              best=None
              for row,addr,name in funcs:
                  if row>idx: break
                  best=(row,addr,name)
              return best

          modules=[]
          for p in sorted(moddir.glob('*.ko')):
              sy='\n'.join(nm(p))
              st=sh(['strings','-a',str(p)])
              if any(k in sy or k in st for k in (
                  'tbq_online_ip_track_alloc','wan_rx_bytes','wan_tx_bytes',
                  'online_ip_hash','nos_track_event_register'
              )):
                  modules.append((p,sy,st))

          with out.open('w',encoding='utf-8') as o:
              o.write('===== RUN 130: NOS/TBQ and online_ip accounting =====\n')
              o.write('\n===== MODULE IDENTIFICATION =====\n')
              for p,sy,st in modules:
                  tags=[]
                  for k in ('tbq_online_ip_track_alloc','wan_rx_bytes','wan_tx_bytes',
                            'online_ip_hash','online_ip_hash_size','nos_track_event_register',
                            'nos_track_event_unregister','clear_online_ip_flag'):
                      if k in sy or k in st: tags.append(k)
                  o.write(f'{p}: {", ".join(tags)}\n')

              for p,sy,st in modules:
                  if not any(k in sy or k in st for k in (
                      'tbq_online_ip_track_alloc','online_ip_hash','nos_track_event_register'
                  )):
                      continue
                  lines=dis(p); funcs=funcs_from_dis(lines)
                  o.write(f'\n\n===== MODULE {p.name} =====\n')
                  o.write('\n--- RELEVANT SYMBOLS ---\n')
                  for l in sy.splitlines():
                      if re.search(r'(tbq|wan_(rx|tx)_bytes|online_ip|nos_track|hook|qos|rate)',l,re.I):
                          o.write(l+'\n')

                  needles=[
                      'tbq_online_ip_track_alloc','wan_rx_bytes','wan_tx_bytes',
                      'online_ip_hash','online_ip_hash_size',
                      'nos_track_event_register','nos_track_event_unregister',
                      'clear_online_ip_flag','nf_register_hooks'
                  ]
                  seen=set()
                  for idx,l in enumerate(lines):
                      if not any(n in l for n in needles):
                          continue
                      own=owner(funcs,idx)
                      key=(own[1],own[2]) if own else ('none',idx)
                      if key in seen: continue
                      seen.add(key)
                      start=max(0,(own[0] if own else idx)-2)
                      end=len(lines)
                      if own:
                          for row,addr,name in funcs:
                              if row>own[0]:
                                  end=row; break
                      block=lines[start:end]
                      o.write(f'\n--- FUNCTION/OWNER {own} triggered by: {l.strip()} ---\n')
                      # For very large functions keep useful neighborhoods only.
                      if len(block) <= 420:
                          o.write('\n'.join(block)+'\n')
                      else:
                          hits=[j for j,x in enumerate(block) if any(n in x for n in needles)]
                          emitted=[]
                          for h in hits:
                              lo=max(0,h-28); hi=min(len(block),h+55)
                              if emitted and lo<=emitted[-1][1]:
                                  emitted[-1]=(emitted[-1][0],max(emitted[-1][1],hi))
                              else:
                                  emitted.append((lo,hi))
                          for lo,hi in emitted:
                              o.write('\n'.join(block[lo:hi])+'\n...\n')

                  # Show exact tbq allocator function even if no relocation line triggered.
                  wanted={'tbq_online_ip_track_alloc','tbq_track_set_weight','tbq_user_track_free'}
                  for row,addr,name in funcs:
                      if name not in wanted: continue
                      end=len(lines)
                      for rr,aa,nn in funcs:
                          if rr>row:
                              end=rr; break
                      o.write(f'\n--- EXACT FUNCTION {name} @ 0x{addr:x} ---\n')
                      o.write('\n'.join(lines[row:end])+'\n')

                  # Relocations often reveal callback registration more clearly than disassembly.
                  rel=sh(['mipsel-linux-gnu-readelf','-rW',str(p)])
                  o.write('\n--- RELOCATIONS RELEVANT TO TRACKING ---\n')
                  for l in rel.splitlines():
                      if re.search(r'(tbq|wan_rx_bytes|wan_tx_bytes|online_ip|nos_track|nf_register_hooks)',l,re.I):
                          o.write(l+'\n')

                  o.write('\n--- RELEVANT STRINGS ---\n')
                  for l in st.splitlines():
                      if re.search(r'(TBQ|wan_rx|wan_tx|bytes per|up_limit|down_limit|online_ip|track event)',l,re.I):
                          o.write(l+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: run130-nos-tbq-accounting
          path: docs/reverse-generated/run130-nos-tbq-accounting.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run130-nos-tbq-accounting.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: trace NOS TBQ online-ip accounting'
            git push
          fi
