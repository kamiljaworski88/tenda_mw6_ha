name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reverse-firmware.yml'
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - run: |
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
      - name: Isolate request builders
        run: |
          root='firmware-src/RootFS-unpacked'
          cli="$root/bin/confcli"
          srv="$root/bin/confsrv"
          out='docs/reverse-generated/confcli-publish-calls.txt'
          mipsel-linux-gnu-objdump -drwC "$cli" > /tmp/confcli.objdump
          mipsel-linux-gnu-objdump -drwC "$srv" > /tmp/confsrv.objdump
          : > "$out"
          echo '===== cmd_pub GOT entry in confcli =====' >> "$out"
          mipsel-linux-gnu-readelf -aW "$cli" | grep -E -C 3 'cmd_pub' >> "$out" || true
          echo '===== every confcli cmd_pub callsite (-31212 gp) =====' >> "$out"
          grep -n -B80 -A120 -- '-31212(gp)' /tmp/confcli.objdump >> "$out" || true
          echo '===== confcli conf_msg_open =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC --disassemble=conf_msg_open "$cli" >> "$out" 2>&1 || true
          echo '===== confcli conf_msg_hander =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC --disassemble=conf_msg_hander "$cli" >> "$out" 2>&1 || true
          echo '===== confcli conf_msg_all_cmds_init =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC --disassemble=conf_msg_all_cmds_init "$cli" >> "$out" 2>&1 || true
          echo '===== confcli GetTrafficInfo string vicinity =====' >> "$out"
          strings -a -t x "$cli" | grep -E -C 12 'GetTrafficInfo|SetWanCfg|GetWanDiag|confctl_cli_key|confctl_srv_key' >> "$out" || true
          echo '===== confsrv GetHostList + dispatcher =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC --disassemble=confctl_get_host_list "$srv" >> "$out" 2>&1 || true
          mipsel-linux-gnu-objdump -drwC --disassemble=conf_msg_hander "$srv" >> "$out" 2>&1 || true
          echo '===== likely 36-byte request builders =====' >> "$out"
          grep -n -B100 -A160 -E '240[23456789]0024|li[[:space:]]+[a-z0-9]+,36' /tmp/confcli.objdump >> "$out" || true
          head -c 950000 "$out" > /tmp/o && mv /tmp/o "$out"
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/confcli-publish-calls.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: refresh cmd_pub request builder map'; git push; fi
