name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Trace start_event_task
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          lib='firmware-src/RootFS-unpacked/lib/libcloud.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/start-event-task-trace.txt'
          {
            echo '===== RUN 80 GOAL ====='
            echo 'Disassemble start_event_task (0x20df8..0x21030) and identify how queued events are consumed / dispatched.'
            echo '===== START_EVENT_TASK ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x20df8 --stop-address=0x21030 "$lib" || true
            echo '===== RELEVANT SYMBOLS ====='
            mipsel-linux-gnu-readelf -sW "$lib" | grep -Ei 'event|queue|dispatch|task|recv|read|pthread|sem|mutex|cond' || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: start-event-task-trace
          path: docs/reverse-generated/start-event-task-trace.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/start-event-task-trace.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add start_event_task trace'; git push || true; fi
