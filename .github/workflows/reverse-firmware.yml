name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Trace event_add_queue internals
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          lib='firmware-src/RootFS-unpacked/lib/libcloud.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/event-add-queue-trace.txt'
          {
            echo '===== RUN 78 GOAL ====='
            echo 'Disassemble event_add_queue and identify the queue object / downstream dispatch path used by event type 64.'
            echo '===== event_add_queue 0x21030..0x211a0 ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x21030 --stop-address=0x211a0 "$lib" || true
            echo '===== SYMBOLS NEAR QUEUE / EVENT ====='
            mipsel-linux-gnu-readelf -sW "$lib" | grep -Ei 'event|queue|dispatch|upload_statistics|start_upload_statistic' || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: event-add-queue-trace
          path: docs/reverse-generated/event-add-queue-trace.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/event-add-queue-trace.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add event_add_queue trace'; git push || true; fi
