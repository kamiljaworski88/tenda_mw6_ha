name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reverse-firmware.yml'

permissions:
  contents: read

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MIPS/QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu gcc-mipsel-linux-gnu git qemu-user python3
      - name: Fetch firmware dump
        run: |
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p reports
      - name: Build MIPS setrlimit compatibility shim
        run: |
          cat > /tmp/nolimit.c <<'C'
          #include <sys/resource.h>
          int setrlimit(__rlimit_resource_t resource, const struct rlimit *rlim) { return 0; }
          C
          mipsel-linux-gnu-gcc -shared -fPIC -O2 /tmp/nolimit.c -o /tmp/libnolimit.so
          file /tmp/libnolimit.so > reports/qemu-shim.txt
      - name: Capture cmdcli encrypted and raw PING frames
        run: |
          root="$PWD/firmware-src/RootFS-unpacked"
          cat > /tmp/capture.py <<'PY'
          import socket, pathlib, sys
          port=int(sys.argv[1]); out=sys.argv[2]
          s=socket.socket(); s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1)
          s.bind(('127.0.0.1',port)); s.listen(1); s.settimeout(15)
          try:
              c,a=s.accept(); c.settimeout(3); chunks=[]
              try:
                  while True:
                      b=c.recv(65535)
                      if not b: break
                      chunks.append(b)
                      if chunks: break
              except Exception: pass
              data=b''.join(chunks)
              pathlib.Path(f'reports/{out}.bin').write_bytes(data)
              pathlib.Path(f'reports/{out}.hex.txt').write_text(data.hex(' ')+'\n')
              pathlib.Path(f'reports/{out}.meta.txt').write_text(f'peer={a} bytes={len(data)}\n')
          except Exception as e:
              pathlib.Path(f'reports/{out}.meta.txt').write_text('capture error: '+repr(e)+'\n')
          PY

          run_capture() {
            mode="$1"; port="$2"; out="$3"
            python3 /tmp/capture.py "$port" "$out" & cap=$!
            sleep 1
            set +e
            timeout 10 qemu-mipsel -L "$root" -E LD_PRELOAD=/tmp/libnolimit.so "$root/sbin/cmdcli" "$mode" "tcp://127.0.0.1:$port" ping > "reports/$out.stdout.txt" 2> "reports/$out.stderr.txt"
            echo $? > "reports/$out.exit.txt"
            wait $cap || true
            set -e
          }
          run_capture -r 19098 cmdcli_encrypted_ping
          run_capture -R 19099 cmdcli_raw_ping
      - name: Save protocol/disassembly evidence
        run: |
          root='firmware-src/RootFS-unpacked'
          strings -a -t x "$root/sbin/cmdsrv" > reports/cmdsrv.strings.txt
          strings -a -t x "$root/sbin/cmdcli" > reports/cmdcli.strings.txt
          strings -a -t x "$root/lib/libredis.so" > reports/libredis.strings.txt
          mipsel-linux-gnu-objdump -drwC "$root/sbin/cmdsrv" > reports/cmdsrv.objdump.txt || true
          mipsel-linux-gnu-objdump -drwC "$root/sbin/cmdcli" > reports/cmdcli.objdump.txt || true
          mipsel-linux-gnu-objdump -drwC "$root/lib/libredis.so" > reports/libredis.objdump.txt || true
          mipsel-linux-gnu-objdump -drwC "$root/lib/libcmdctl.so" > reports/libcmdctl.objdump.txt || true
      - name: Extract rate implementation evidence
        run: |
          root='firmware-src/RootFS-unpacked'
          for f in "$root/bin/confsrv" "$root/lib/libcommon.so" "$root/bin/log_upload"; do
            safe=$(basename "$f")
            strings -a -t x "$f" > "reports/$safe.strings.txt"
            mipsel-linux-gnu-objdump -drwC "$f" > "reports/$safe.objdump.txt" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mw6-wire-reverse-reports
          path: reports/
          retention-days: 14
