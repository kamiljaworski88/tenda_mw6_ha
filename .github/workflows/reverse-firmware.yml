name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git

      - name: Decode bm kernel client statistics
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
          root='firmware-src/RootFS-unpacked/lib/modules'
          out='docs/reverse-generated/run120-bm-client-statistics.txt'
          bm="$root/bm.ko"
          {
            echo '===== RUN 120: bm.ko client statistics / netlink ====='
            echo
            echo '===== BM SYMBOLS ====='
            mipsel-linux-gnu-nm -a "$bm" | sort || true
            echo
            echo '===== BM STRINGS ====='
            strings -a -t x "$bm" | grep -Ei 'netlink|online|hash|stat|traffic|byte|packet|client|host|clear|upload|download|up_|down_|fast|nat|ip|mac' || true
            echo
            echo '===== BM RELOCATIONS ====='
            mipsel-linux-gnu-readelf -r "$bm" || true
            echo
            echo '===== BM DISASSEMBLY ====='
            mipsel-linux-gnu-objdump -drwC "$bm" || true
            echo
            echo '===== NETLINK CALL CONTEXTS ====='
            mipsel-linux-gnu-objdump -drwC "$bm" | grep -n -B24 -A48 -E '__netlink_kernel_create|netlink_rcv_skb|netlink_broadcast|bm_netlink|nlmsg|online_ip_hash|clear_online_ip_flag' || true
            echo
            echo '===== CANDIDATE MODULES USING online_ip_hash ====='
            find "$root" -type f -name '*.ko' -size +0c -print0 | while IFS= read -r -d '' f; do
              hits=$(mipsel-linux-gnu-nm -a "$f" 2>/dev/null | grep -E 'online_ip_hash|online_ip_hash_size|clear_online_ip_flag' || true)
              if [ -n "$hits" ]; then
                echo "--- $f ---"
                echo "$hits"
              fi
            done
            echo
            echo '===== NOS SYMBOLS / STRINGS AROUND ONLINE TRACKING ====='
            mipsel-linux-gnu-nm -a "$root/nos.ko" 2>/dev/null | grep -Ei 'online|track|stat|byte|traffic|netlink|hash' || true
            strings -a -t x "$root/nos.ko" | grep -Ei 'online|track|stat|byte|traffic|netlink|hash|fastpath|nat' || true
          } > "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: run120-bm-client-statistics
          path: docs/reverse-generated/run120-bm-client-statistics.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run120-bm-client-statistics.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: decode bm kernel client statistics'
            git push
          fi
