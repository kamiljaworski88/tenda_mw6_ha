name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git xz-utils python3-pip
          python3 -m pip install --break-system-packages vmlinux-to-elf pyelftools

      - name: Map online_ip lookup callers
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated /tmp/mw6kernel
          img='firmware-src/image-unpacked-as-per-mtd/30_KernelFS'
          raw='/tmp/mw6kernel/kernel.raw'
          elf='/tmp/mw6kernel/kernel.elf'
          out='docs/reverse-generated/run125-online-ip-lookup-callers.txt'

          dd if="$img" of=/tmp/mw6kernel/kernel.lzma bs=1 skip=$((0x2818)) status=none
          xz --format=lzma -dc /tmp/mw6kernel/kernel.lzma > "$raw" || true
          test -s "$raw"
          vmlinux-to-elf "$raw" "$elf" >/tmp/mw6kernel/v2e.log 2>&1
          test -s "$elf"

          python3 - "$elf" "$out" <<'PY'
          import struct, subprocess, sys
          from pathlib import Path
          from elftools.elf.elffile import ELFFile

          elf_path=Path(sys.argv[1]); out_path=Path(sys.argv[2])
          nm=subprocess.check_output(['mipsel-linux-gnu-nm','-n',str(elf_path)],text=True,errors='replace').splitlines()
          syms=[]
          for line in nm:
              p=line.split(maxsplit=2)
              if len(p)==3:
                  try: syms.append((int(p[0],16),p[1],p[2]))
                  except ValueError: pass
          syms.sort()

          def owner(addr):
              best=None; nxt=None
              for i,(a,t,n) in enumerate(syms):
                  if a<=addr and t.lower() in ('t','w'):
                      best=(a,t,n)
                  if a>addr and best is not None:
                      nxt=a; break
              if best is None: return None
              return (*best,nxt or best[0]+0x800)

          targets={
              'find_online_ip':0x803d2c4c,
              'online_ip_get_idx':0x803d2cbc,
              'add_online_ip':0x803d4190,
              'clear_online_ip_flag':0x803d33f8,
              'set_online_ip_flag':0x803d3490,
          }
          target_ins={name:0x0c000000|((addr>>2)&0x03ffffff) for name,addr in targets.items()}
          hits={k:[] for k in targets}
          with elf_path.open('rb') as f:
              elf=ELFFile(f)
              for sec in elf.iter_sections():
                  flags=int(sec['sh_flags'])
                  if not (flags & 0x4):
                      continue
                  base=int(sec['sh_addr']); data=sec.data()
                  for off in range(0,len(data)-3,4):
                      word=struct.unpack_from('<I',data,off)[0]
                      for name,ins in target_ins.items():
                          if word==ins:
                              hits[name].append(base+off)

          with out_path.open('w',encoding='utf-8') as o:
              o.write('===== RUN 125: online_ip lookup/counter path callers =====\n')
              done=set()
              for name,addr in targets.items():
                  o.write(f'\n===== {name} @ 0x{addr:08x} =====\n')
                  for call in hits[name]:
                      own=owner(call)
                      o.write(f'call=0x{call:08x} owner={own}\n')
                      if own and own[0] not in done:
                          done.add(own[0])
                          start=own[0]; stop=min(own[3],start+0x3000)
                          o.write(f'--- DISASM {own[2]} 0x{start:08x}..0x{stop:08x} ---\n')
                          txt=subprocess.check_output([
                              'mipsel-linux-gnu-objdump','-drwC',
                              f'--start-address=0x{start:x}',f'--stop-address=0x{stop:x}',str(elf_path)
                          ],text=True,errors='replace')
                          o.write(txt+'\n')
              o.write('\n===== RELEVANT SYMBOL NAMES =====\n')
              for a,t,n in syms:
                  low=n.lower()
                  if any(k in low for k in ('online_ip','conntrack','fastpath','fast_nat','fastnat','hw_nat','sw_nat','forward_hook','prerouting')):
                      o.write(f'{a:08x} {t} {n}\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: run125-online-ip-lookup-callers
          path: docs/reverse-generated/run125-online-ip-lookup-callers.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run125-online-ip-lookup-callers.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: map online_ip lookup callers'
            git push
          fi
