name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Trace SYS BasicInfo callback slots
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          lib='firmware-src/RootFS-unpacked/lib/libucapi.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/sys-basic-callback-slots.txt'
          {
            echo '===== RUN 62 GOAL ====='
            echo 'Identify who populates uc_api_enable_m_cloud_info input slots +0x50/+0x54 used as SYS BasicInfo callback/context.'
            echo '===== DEFINITIVE REGISTRATION WINDOW ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x8040 --stop-address=0x80e0 "$lib" || true
            echo '===== STORES TO OFFSETS 80/84 ====='
            mipsel-linux-gnu-objdump -drwC "$lib" | grep -E -B12 -A16 'sw[[:space:]].*,(80|84)\(' || true
            echo '===== uc_api_lib_init WINDOW ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x6f80 --stop-address=0x7420 "$lib" || true
            echo '===== RELEVANT SYMBOLS ====='
            mipsel-linux-gnu-readelf -sW "$lib" | grep -E 'uc_api_enable_m_cloud_info|uc_api_set_basic_info|sys_basic|cloud_info' || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: sys-basic-callback-slots
          path: docs/reverse-generated/sys-basic-callback-slots.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/sys-basic-callback-slots.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add SYS BasicInfo callback slot trace'; git push || true; fi
