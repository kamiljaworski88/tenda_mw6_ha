name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Resolve upload_statistics first-call stub
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          lib='firmware-src/RootFS-unpacked/lib/libcloud.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/upload-statistics-first-call-stub.txt'
          {
            echo '===== RUN 74 GOAL ====='
            echo 'Resolve GOT value 0x00064e20 used by upload_statistics first call to the exact imported symbol/function.'
            echo '===== SECTION MAP AROUND 0x64e20 ====='
            mipsel-linux-gnu-readelf -SW "$lib" | grep -E '\.text|\.MIPS\.stubs|\.plt|\.fini' || true
            echo '===== DISASSEMBLY 0x64de0..0x64e60 ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x64de0 --stop-address=0x64e60 "$lib" || true
            echo '===== DYNSYM WITH INDEX ====='
            mipsel-linux-gnu-readelf -sW "$lib" | nl -ba | sed -n '1,1700p' || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: upload-statistics-first-call-stub
          path: docs/reverse-generated/upload-statistics-first-call-stub.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/upload-statistics-first-call-stub.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add upload_statistics first-call stub report'; git push || true; fi
