name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Map mesh WAN traffic API
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          lib='firmware-src/RootFS-unpacked/lib/libucapi.so'
          pb='firmware-src/RootFS-unpacked/lib/libpb.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/mesh-wan-traffic-api.txt'
          {
            echo '===== RUN 65 GOAL ====='
            echo 'Map GetTrafficInfo / CMD_MESH_WAN_TRAFFIC to exact module id, command id, registration function, handler and response schema. Determine whether it can expose client traffic or only aggregate WAN traffic.'
            echo '===== SYMBOLS ====='
            mipsel-linux-gnu-readelf -sW "$lib" | grep -Ei 'traffic|wan.*rate|mesh.*wan|GetTrafficInfo|uc_api_enable_m_mesh' || true
            echo '===== COMMAND / MODULE STRINGS ====='
            strings -a -t x "$lib" | grep -Ei 'GetTrafficInfo|CMD_MESH_WAN_TRAFFIC|M_MESH_WAN|WAN_TRAFFIC|traffic' | head -n 240 || true
            echo '===== DISASSEMBLY AROUND STRING-RELATED SYMBOLS ====='
            mipsel-linux-gnu-objdump -drwC "$lib" | grep -B22 -A34 -Ei 'traffic|wan_rate|mesh_wan' | head -n 1200 || true
            echo '===== LIBPB TRAFFIC SCHEMA ====='
            strings -a -t x "$pb" | grep -Ei 'traffic|uprate|downrate|total_up|total_down|WanRate|WanPortRate|HostInfo' | head -n 260 || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-wan-traffic-api
          path: docs/reverse-generated/mesh-wan-traffic-api.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/mesh-wan-traffic-api.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add mesh WAN traffic API map'; git push || true; fi
