name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git xz-utils python3-pip
          python3 -m pip install --break-system-packages vmlinux-to-elf pyelftools

      - name: Resolve nos_tbq_enqueue kernel call sites
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated /tmp/mw6kernel
          img='firmware-src/image-unpacked-as-per-mtd/30_KernelFS'
          raw='/tmp/mw6kernel/kernel.raw'
          elf='/tmp/mw6kernel/kernel.elf'
          nos='firmware-src/RootFS-unpacked/lib/modules/nos.ko'
          out='docs/reverse-generated/run144-nos-tbq-callback-callers.txt'

          dd if="$img" of=/tmp/mw6kernel/kernel.lzma bs=1 skip=$((0x2818)) status=none
          xz --format=lzma -dc /tmp/mw6kernel/kernel.lzma > "$raw" || true
          test -s "$raw"
          vmlinux-to-elf "$raw" "$elf" >/tmp/mw6kernel/v2e.log 2>&1

          mipsel-linux-gnu-objdump -drwC "$elf" > /tmp/mw6kernel/kernel.dis
          mipsel-linux-gnu-objdump -drwC "$nos" > /tmp/mw6kernel/nos.dis

          python3 - "$elf" /tmp/mw6kernel/kernel.dis /tmp/mw6kernel/nos.dis "$out" <<'PY'
          import re, struct, sys
          from pathlib import Path
          from elftools.elf.elffile import ELFFile

          elf_path=Path(sys.argv[1])
          kdis=Path(sys.argv[2]).read_text(errors='replace').splitlines()
          ndis=Path(sys.argv[3]).read_text(errors='replace').splitlines()
          out=Path(sys.argv[4])

          KSYMTAB=0x80547fd8

          with elf_path.open('rb') as f:
              ef=ELFFile(f)
              raw=None
              secname=None
              for sec in ef.iter_sections():
                  a=sec['sh_addr']; z=sec['sh_size']
                  if a <= KSYMTAB and KSYMTAB+8 <= a+z:
                      off=KSYMTAB-a
                      raw=sec.data()[off:off+8]
                      secname=sec.name
                      break
              if raw is None:
                  raise SystemExit('ksymtab entry not mapped')
              value,nameptr=struct.unpack('<II',raw)

          # Function ownership map.
          funcs=[]
          for i,l in enumerate(kdis):
              m=re.match(r'^([0-9a-fA-F]+) <([^>]+)>:',l)
              if m: funcs.append((i,int(m.group(1),16),m.group(2)))
          def owner(idx):
              lo,hi=0,len(funcs)
              while lo<hi:
                  mid=(lo+hi)//2
                  if funcs[mid][0] <= idx: lo=mid+1
                  else: hi=mid
              return funcs[lo-1] if lo else None

          # Parse MIPS absolute references of form:
          # lui r, HI ; ... lw/sw x, LO(r)
          # Account for sign-extended LO by using (hi<<16)+signed(lo).
          refs=[]
          for i,l in enumerate(kdis):
              lm=re.search(r'\blui\s+([a-z0-9]+),(0x[0-9a-fA-F]+|\d+)',l)
              if not lm: continue
              base=lm.group(1); hi=int(lm.group(2),0)
              for j in range(i+1,min(len(kdis),i+14)):
                  # Stop on next function boundary.
                  if re.match(r'^[0-9a-fA-F]+ <[^>]+>:',kdis[j]): break
                  mm=re.search(rf'\b(lw|sw)\s+([a-z0-9]+),(-?\d+)\({base}\)',kdis[j])
                  if not mm: continue
                  op,reg,lo=mm.group(1),mm.group(2),int(mm.group(3))
                  addr=((hi<<16)+lo)&0xffffffff
                  if addr==value:
                      fn=owner(i)
                      ctx=kdis[max(fn[0] if fn else 0,i-10):min(len(kdis),j+22)]
                      refs.append((fn,op,reg,i,j,ctx))

          # Find callback function in nos.ko at 0x5e9c and end at next symbol/function.
          nfuncs=[]
          for i,l in enumerate(ndis):
              m=re.match(r'^([0-9a-fA-F]+) <([^>]+)>:',l)
              if m:nfuncs.append((i,int(m.group(1),16),m.group(2)))
          cb_start=None; cb_end=None
          for idx,(li,a,n) in enumerate(nfuncs):
              if a==0x5e9c:
                  cb_start=li
                  cb_end=nfuncs[idx+1][0] if idx+1<len(nfuncs) else len(ndis)
                  break
          if cb_start is None:
              # 0x5e9c can be an unnamed local target inside init_module;
              # dump by address with objdump output line search.
              for i,l in enumerate(ndis):
                  if re.match(r'^\s*5e9c:',l):
                      cb_start=i; cb_end=min(len(ndis),i+650); break

          with out.open('w',encoding='utf-8') as o:
              o.write('===== RUN 144: nos_tbq_enqueue pointer and callers =====\n')
              o.write(f'ksymtab entry @ 0x{KSYMTAB:08x} section={secname}\n')
              o.write(f'exported variable address = 0x{value:08x}\n')
              o.write(f'export name pointer       = 0x{nameptr:08x}\n\n')

              o.write('===== KERNEL REFERENCES TO EXPORTED CALLBACK POINTER =====\n')
              if not refs:
                  o.write('NO REFERENCES FOUND BY LUI+LW/SW SCAN\n')
              for fn,op,reg,i,j,ctx in refs:
                  if fn:
                      o.write(f'\n--- 0x{fn[1]:08x} <{fn[2]}> {op} ref ---\n')
                  else:
                      o.write('\n--- unknown owner ---\n')
                  o.write('\n'.join(ctx)+'\n')

              o.write('\n===== NOS CALLBACK INSTALLED AT .text+0x5e9c =====\n')
              if cb_start is not None:
                  o.write('\n'.join(ndis[cb_start:cb_end])+'\n')
              else:
                  o.write('CALLBACK START NOT FOUND\n')

              o.write('\n===== NOS RELOCS/CALLS INSIDE 0x5e9c..0x6428 =====\n')
              for l in ndis:
                  am=re.match(r'^\s*([0-9a-fA-F]+):',l)
                  if not am: continue
                  a=int(am.group(1),16)
                  if 0x5e9c <= a < 0x6428 and re.search(
                    r'R_MIPS_|jal|jalr|online_ip|tbq_|wan_(?:rx|tx)|nf_|conn',l,re.I):
                      o.write(l+'\n')

              o.write('\n===== DIRECT FASTPATH SYMBOL RANGES =====\n')
              # Dump caller functions from kernel refs in full enough context.
              emitted=set()
              for fn,op,reg,i,j,ctx in refs:
                  if not fn or fn[1] in emitted: continue
                  emitted.add(fn[1])
                  st=fn[0]
                  en=next((x[0] for x in funcs if x[0]>st),min(len(kdis),st+1200))
                  o.write(f'\n--- FULL 0x{fn[1]:08x} <{fn[2]}> ---\n')
                  o.write('\n'.join(kdis[st:en])+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: run144-nos-tbq-callback-callers
          path: docs/reverse-generated/run144-nos-tbq-callback-callers.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run144-nos-tbq-callback-callers.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: resolve NOS callback callers'
            git push
          fi
