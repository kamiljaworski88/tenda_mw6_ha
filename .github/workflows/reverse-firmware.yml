name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git

      - name: Trace netlink_get_statistic_info
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/run135-netlink-statistic-userspace.txt'

          python3 - firmware-src "$out" <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          root=Path(sys.argv[1]); out=Path(sys.argv[2])

          def run(cmd):
              return subprocess.run(cmd, text=True, errors='replace',
                                    stdout=subprocess.PIPE, stderr=subprocess.STDOUT).stdout

          defs=[]
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              try:
                  nm=run(["mipsel-linux-gnu-nm","-D",str(p)])
              except Exception:
                  continue
              if "netlink_get_statistic_info" in nm:
                  for l in nm.splitlines():
                      if "netlink_get_statistic_info" not in l: continue
                      parts=l.split()
                      if len(parts)>=3 and parts[-1]=="netlink_get_statistic_info":
                          defs.append((p,l))

          with out.open("w",encoding="utf-8") as o:
              o.write("===== RUN 135: userspace netlink_get_statistic_info =====\n")
              o.write("===== DEFINITIONS / REFERENCES =====\n")
              for p,l in defs:
                  o.write(f"{p}: {l}\n")

              for p,l in defs:
                  parts=l.split()
                  typ=parts[-2] if len(parts)>=3 else ""
                  if typ.upper()=="U":
                      continue
                  try:
                      addr=int(parts[0],16)
                  except Exception:
                      continue

                  syms=[]
                  for sl in run(["mipsel-linux-gnu-nm","-D","-n",str(p)]).splitlines():
                      q=sl.split(maxsplit=2)
                      if len(q)==3:
                          try:a=int(q[0],16)
                          except:continue
                          syms.append((a,q[1],q[2]))
                  syms.sort()
                  nxt=addr+0x3000
                  for a,t,n in syms:
                      if a>addr:
                          nxt=a; break

                  o.write(f"\n===== OWNER {p} @ 0x{addr:x} =====\n")
                  o.write(run(["mipsel-linux-gnu-readelf","-A",str(p)]))
                  o.write("\n===== SYMBOLS FILTERED =====\n")
                  for sl in run(["mipsel-linux-gnu-readelf","-Ws",str(p)]).splitlines():
                      if re.search(r'netlink|statistic|g_ip_info|socket|send|recv|malloc|calloc|free|online|nlmsg|poll|select|time|usleep',sl,re.I):
                          o.write(sl+"\n")
                  o.write("\n===== FUNCTION DISASSEMBLY =====\n")
                  o.write(run(["mipsel-linux-gnu-objdump","-drwC",
                               f"--start-address=0x{addr:x}",f"--stop-address=0x{nxt:x}",str(p)]))

                  # Also dump nearby named functions that look related.
                  for a,t,n in syms:
                      if re.search(r'netlink|statistic|online|nlmsg',n,re.I) and n!="netlink_get_statistic_info":
                          stop=a+0x1800
                          for aa,tt,nn in syms:
                              if aa>a:
                                  stop=aa; break
                          o.write(f"\n===== RELATED {n} @ 0x{a:x} =====\n")
                          o.write(run(["mipsel-linux-gnu-objdump","-drwC",
                                     f"--start-address=0x{a:x}",f"--stop-address=0x{stop:x}",str(p)]))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: run135-netlink-statistic-userspace
          path: docs/reverse-generated/run135-netlink-statistic-userspace.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run135-netlink-statistic-userspace.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: trace userspace netlink statistics'
            git push
          fi
