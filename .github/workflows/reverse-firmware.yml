name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Trace BasicInfo protobuf schema
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          lib='firmware-src/RootFS-unpacked/lib/libucapi.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/sys-basic-info-schema.txt'
          {
            echo '===== RUN 57 GOAL ====='
            echo 'Find BasicInfo protobuf/message descriptor and field names used by M_SYS cmd0 response.'
            echo '===== BASICINFO / DESCRIPTOR SYMBOLS ====='
            mipsel-linux-gnu-readelf -sW "$lib" | grep -Ei 'basic.?info|descriptor|protobuf|serial' || true
            echo '===== BASICINFO / SERIAL STRINGS ====='
            strings -a -t x "$lib" | grep -Ei 'BasicInfo|basic_info|serial(_num|\.number|number)?|sys\.model|soft\.ver|descriptor' || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: sys-basic-info-schema
          path: docs/reverse-generated/sys-basic-info-schema.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/sys-basic-info-schema.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add BasicInfo schema trace'; git push || true; fi
