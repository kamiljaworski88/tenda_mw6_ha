name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3
      - name: Disassemble resolved GetHostList helpers
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          conf='firmware-src/RootFS-unpacked/bin/confsrv'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/rate-helper-disasm.txt'
          mipsel-linux-gnu-objdump -drwC "$conf" > /tmp/conf.asm
          {
            echo '===== RESOLUTION ====='
            echo 'GetHostList GP = 0x434f9c + 0x621c4 = 0x497160'
            echo 'GOT[-31956] @ 0x48f48c = 0x430000'
            echo 'calls: 0x433e3c, 0x434258, 0x4307b0'
            echo '===== helper 0x433e3c ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x433e3c --stop-address=0x434258 "$conf" || true
            echo '===== helper 0x434258 ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x434258 --stop-address=0x434780 "$conf" || true
            echo '===== helper 0x4307b0 ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x4307b0 --stop-address=0x430d80 "$conf" || true
            echo '===== netlink_get_statistic_info GOT users ====='
            grep -n -B30 -A80 -- '-31216(gp)' /tmp/conf.asm || true
            echo '===== rate strings + xrefs vicinity ====='
            strings -a -t x "$conf" | grep -iE 'uprate|downrate|online_ip|statistic|host.*rate|rate.*host' || true
            echo '===== calls from resolved helper ranges ====='
            awk '$1 ~ /^433e|^433f|^4340|^4341|^4342|^4343|^4344|^4345|^4346|^4347|^4307|^4308|^4309|^430a|^430b|^430c|^430d/ {print}' /tmp/conf.asm | grep -E 'jalr|jal[[:space:]]' || true
          } > "$out"
          head -c 1400000 "$out" > /tmp/cut && mv /tmp/cut "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: rate-helper-disasm
          path: docs/reverse-generated/rate-helper-disasm.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/rate-helper-disasm.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: disassemble GetHostList rate helpers'; git push || true; fi
