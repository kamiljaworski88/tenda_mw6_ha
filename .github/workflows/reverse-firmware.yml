name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Find live per-client traffic command candidates
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          root='firmware-src/RootFS-unpacked'
          lib="$root/lib/libucapi.so"
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/client-traffic-command-candidates.txt'
          {
            echo '===== RUN 63 GOAL ====='
            echo 'Find a local API command that can expose live per-client upload/download rates; M_MESH_HOSTS GET returns valid hosts but rate fields stay zero on this MW6 firmware.'
            echo '===== LIBUCAPI COMMAND STRINGS ====='
            strings -a -t x "$lib" | grep -Ei 'CMD_.*(RATE|SPEED|TRAFFIC|FLOW|HOST|QOS|ONLINE|DEVICE)|Get.*(Rate|Speed|Traffic|Flow|Host|Online|Device)|(Rate|Speed|Traffic|Flow|Host|Online|Device).*Get' || true
            echo '===== LIBUCAPI RELEVANT SYMBOLS ====='
            mipsel-linux-gnu-readelf -sW "$lib" | grep -Ei 'rate|speed|traffic|flow|host|qos|online|statistic' || true
            echo '===== FILES CONTAINING UPRATE / DOWNRATE ====='
            while IFS= read -r -d '' f; do
              if strings -a "$f" 2>/dev/null | grep -Eiq 'uprate|downrate'; then
                echo "--- $f ---"
                strings -a -t x "$f" 2>/dev/null | grep -Ei -B12 -A20 'uprate|downrate' || true
              fi
            done < <(find "$root" -type f -print0)
            echo '===== FILES / STRINGS FOR LIVE STATISTICS ====='
            while IFS= read -r -d '' f; do
              hits=$(strings -a "$f" 2>/dev/null | grep -Ei 'netlink_get_statistic_info|online_ip|traffic[_ -]?stat|flow[_ -]?stat|host[_ -]?rate|device[_ -]?rate' || true)
              if [ -n "$hits" ]; then
                echo "--- $f ---"
                printf '%s\n' "$hits"
              fi
            done < <(find "$root" -type f -print0)
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: client-traffic-command-candidates
          path: docs/reverse-generated/client-traffic-command-candidates.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/client-traffic-command-candidates.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add live client traffic command candidates'; git push || true; fi
