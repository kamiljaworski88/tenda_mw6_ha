name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reverse-firmware.yml'

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install reverse tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3
      - name: Fetch firmware dump
        run: |
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p reports docs/reverse-generated
      - name: Disassemble client/cloud stack
        run: |
          root='firmware-src/RootFS-unpacked'
          for f in "$root/lib/libcommon.so" "$root/lib/libcloud.so" "$root/lib/libucapi.so" "$root/lib/libpb.so" "$root/bin/device_list" "$root/bin/confsrv" "$root/bin/ucloud"; do
            [ -f "$f" ] || continue
            safe=$(echo "${f#$root/}" | tr '/' '_')
            mipsel-linux-gnu-readelf -aW "$f" > "reports/$safe.readelf.txt" 2>&1 || true
            mipsel-linux-gnu-objdump -drwC "$f" > "reports/$safe.objdump.txt" 2>&1 || true
            mipsel-linux-gnu-objdump -s "$f" > "reports/$safe.sections.txt" 2>&1 || true
            strings -a -t x "$f" > "reports/$safe.strings.txt" || true
          done
      - name: Build focused GetHostList map
        run: |
          out='docs/reverse-generated/client-api-map.txt'
          : > "$out"
          echo '# Auto-generated MW6 GetHostList / client API map' >> "$out"
          echo '# Source: public MW6 firmware dump; generated by GitHub Actions' >> "$out"
          echo >> "$out"
          echo '===== GetHostList and host symbols =====' >> "$out"
          grep -iE -C 8 'GetHostList|confctl_get_host_list|host_lists__|host_info__|fill_host_lists|fill_host_info|online_ip|g_ip_info|uprate|downrate|confctl_cli_key|confctl_srv_key|conf_msg_cmd_init|conf_msg_define' reports/bin_confsrv.strings.txt >> "$out" || true
          grep -iE 'GetHostList|confctl_get_host_list|host_lists__|host_info__|fill_host_lists|fill_host_info|conf_msg' reports/bin_confsrv.readelf.txt >> "$out" || true
          echo '===== confsrv GetHostList =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC --disassemble=confctl_get_host_list firmware-src/RootFS-unpacked/bin/confsrv >> "$out" 2>&1 || true
          echo '===== confsrv fill_host_lists_info =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC --disassemble=fill_host_lists_info firmware-src/RootFS-unpacked/bin/confsrv >> "$out" 2>&1 || true
          echo '===== confsrv fill_host_lists_rate =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC --disassemble=fill_host_lists_rate firmware-src/RootFS-unpacked/bin/confsrv >> "$out" 2>&1 || true
          echo '===== confsrv fill_host_info_from_client_status =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC --disassemble=fill_host_info_from_client_status firmware-src/RootFS-unpacked/bin/confsrv >> "$out" 2>&1 || true
          echo '===== confsrv registration vicinity / references =====' >> "$out"
          grep -n -B120 -A220 -E 'GetHostList|confctl_get_host_list|conf_msg_cmd_init|conf_msg_define' reports/bin_confsrv.objdump.txt >> "$out" || true
          echo '===== host protobuf descriptor vicinity =====' >> "$out"
          grep -n -B50 -A160 -E 'host_lists__descriptor|host_info__descriptor|host_lists__pack|host_info__init' reports/bin_confsrv.objdump.txt >> "$out" || true
          echo '===== host descriptor section references =====' >> "$out"
          grep -n -B20 -A80 -E 'host_lists__descriptor|host_info__descriptor' reports/bin_confsrv.readelf.txt >> "$out" || true
          echo '===== libucapi OL hosts API =====' >> "$out"
          mipsel-linux-gnu-objdump -drwC --disassemble=uc_api_lib_ol_hosts_get_hdl_reg firmware-src/RootFS-unpacked/lib/libucapi.so >> "$out" 2>&1 || true
          grep -iE -C 12 'ol_hosts|host_info_msg|host_info_single_msg|GetHostList' reports/lib_libucapi.so.strings.txt >> "$out" || true
          head -c 950000 "$out" > "$out.tmp" && mv "$out.tmp" "$out"
      - name: Commit compact map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/client-api-map.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: refresh generated GetHostList map'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mw6-gethostlist-reverse-reports
          path: reports/
          retention-days: 14
