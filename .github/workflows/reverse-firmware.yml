name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Trace GetBasicInfo serial source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          lib='firmware-src/RootFS-unpacked/lib/libucapi.so'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/sys-basic-serial-xref.txt'
          {
            echo '===== RUN 51 GOAL ====='
            echo 'Trace GetBasicInfo cmd0 producer and serial.number source.'
            echo '===== FUNCTION AFTER BASIC-INFO REG WRAPPER ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x1682c --stop-address=0x16b80 "$lib" || true
            echo '===== SYMBOLS 0x16800..0x16c00 ====='
            mipsel-linux-gnu-readelf -sW "$lib" | awk '$2 ~ /^00016[89ab]/ {print}' || true
            echo '===== DYNAMIC SYMBOLS: GetValue / BASIC INFO ====='
            mipsel-linux-gnu-readelf -sW "$lib" | grep -E 'GetValue|BasicInfo|basic_info' || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: sys-basic-serial-xref
          path: docs/reverse-generated/sys-basic-serial-xref.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/sys-basic-serial-xref.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add GetBasicInfo serial xref'; git push || true; fi
