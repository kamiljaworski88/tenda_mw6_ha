name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/reverse-firmware.yml']
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Find firmware users of dev traffic sender
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          root='firmware-src/RootFS-unpacked'
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/dev-traffic-sender-users.txt'
          {
            echo '===== RUN 72 GOAL ====='
            echo 'Find every ELF or file outside libucapi.so that references uc_api_m_cloud_info_send_dev_traffic.'
            echo '===== DYNAMIC SYMBOL USERS ====='
            while IFS= read -r -d '' f; do
              if mipsel-linux-gnu-readelf -sW "$f" 2>/dev/null | grep -q 'uc_api_m_cloud_info_send_dev_traffic'; then
                echo "--- $f"
                mipsel-linux-gnu-readelf -sW "$f" 2>/dev/null | grep 'uc_api_m_cloud_info_send_dev_traffic' || true
              fi
            done < <(find "$root" -type f -print0)
            echo '===== STRING USERS (DLSYM / TABLES) ====='
            grep -RIl --binary-files=text 'uc_api_m_cloud_info_send_dev_traffic' "$root" 2>/dev/null || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: dev-traffic-sender-users
          path: docs/reverse-generated/dev-traffic-sender-users.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/dev-traffic-sender-users.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: add dev traffic sender users'; git push || true; fi
