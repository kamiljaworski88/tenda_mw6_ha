name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Trace need_upload filtering
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
          dev='firmware-src/RootFS-unpacked/bin/device_list'
          out='docs/reverse-generated/run169-need-upload-filter.txt'
          {
            echo '===== RUN 169: need_upload filtering ====='
            echo
            echo '===== strings ====='
            strings -tx "$dev" | grep -Ei 'need_upload|upload_nova_client_node|upload.*client|client.*upload' || true
            echo
            echo '===== xref windows for rodata low16 d373/d988 ====='
            mipsel-linux-gnu-objdump -drwC "$dev" | grep -B40 -A80 -E 'd373|d988' || true
            echo
            echo '===== full do_upload_client_list ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x40bb84 --stop-address=0x40bfd4 "$dev"
            echo
            echo '===== client record update/upload helpers nearby ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x40b2a8 --stop-address=0x40bb84 "$dev"
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: run169-need-upload-filter
          path: docs/reverse-generated/run169-need-upload-filter.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run169-need-upload-filter.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: trace need_upload filtering'
            git push
          fi
