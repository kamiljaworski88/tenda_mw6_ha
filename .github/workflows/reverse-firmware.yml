name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git xz-utils python3-pip
          python3 -m pip install --break-system-packages vmlinux-to-elf

      - name: Trace conntrack online_ip counter updates
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated /tmp/mw6kernel
          img='firmware-src/image-unpacked-as-per-mtd/30_KernelFS'
          raw='/tmp/mw6kernel/kernel.raw'
          elf='/tmp/mw6kernel/kernel.elf'
          dis='/tmp/mw6kernel/kernel.dis'
          syms='/tmp/mw6kernel/kernel.syms'
          out='docs/reverse-generated/run126-conntrack-onlineip-counters.txt'

          dd if="$img" of=/tmp/mw6kernel/kernel.lzma bs=1 skip=$((0x2818)) status=none
          xz --format=lzma -dc /tmp/mw6kernel/kernel.lzma > "$raw" || true
          test -s "$raw"
          vmlinux-to-elf "$raw" "$elf" >/tmp/mw6kernel/v2e.log 2>&1
          mipsel-linux-gnu-nm -n "$elf" > "$syms"
          mipsel-linux-gnu-objdump -drwC "$elf" > "$dis"

          python3 - "$dis" "$syms" "$out" <<'PY'
          import re, sys
          from pathlib import Path
          dis_path, sym_path, out_path = map(Path, sys.argv[1:])
          lines=dis_path.read_text(errors='replace').splitlines()
          syms=[]
          for line in sym_path.read_text(errors='replace').splitlines():
              p=line.split(maxsplit=2)
              if len(p)==3:
                  try: syms.append((int(p[0],16),p[1],p[2]))
                  except: pass
          syms.sort()
          funcs=[(a,t,n) for a,t,n in syms if t.lower() in ('t','w')]
          def owner(addr):
              best=None; nxt=None
              for i,(a,t,n) in enumerate(funcs):
                  if a<=addr: best=(a,t,n); nxt=funcs[i+1][0] if i+1<len(funcs) else a+0x1000
                  else: break
              return (*best,nxt) if best else None
          def addr_of(line):
              m=re.match(r'^\s*([0-9a-fA-F]+):',line)
              return int(m.group(1),16) if m else None

          # Candidate functions loading ct->online_ip (custom pointer at +0x8c / 140).
          load_pat=re.compile(r'\blw\s+([a-z0-9]+),140\(([a-z0-9]+)\)')
          candidates={}
          for i,line in enumerate(lines):
              m=load_pat.search(line)
              if not m: continue
              a=addr_of(line)
              own=owner(a) if a else None
              if own: candidates.setdefault(own[0], {'owner':own,'hits':[]})['hits'].append((i,m.group(1),m.group(2),line))

          with out_path.open('w',encoding='utf-8') as o:
              o.write('===== RUN 126: ct->online_ip (+0x8c) counter updates =====\n')
              o.write(f'candidate functions={len(candidates)}\n')
              for start,entry in sorted(candidates.items()):
                  own=entry['owner']; stop=min(own[3],start+0x5000)
                  # Extract full function once; flag functions touching relevant online_ip offsets.
                  text='\n'.join(lines)
                  # Use objdump separately below only for selected owner address range via source line slicing.
                  idxs=[i for i,l in enumerate(lines) if (addr_of(l) is not None and start <= addr_of(l) < stop)]
                  if not idxs: continue
                  block=lines[min(idxs):max(idxs)+1]
                  # Registers loaded from +140, then look for accesses via those regs; also common moves.
                  regs={r for _i,r,_b,_l in entry['hits']}
                  interesting=[]
                  for j,l in enumerate(block):
                      for r in regs:
                          if re.search(rf'\b(?:lw|sw|lbu|sb|lh|sh)\s+[^,]+,(64|80|84|88|92|96|100|104|108)\({r}\)',l):
                              interesting.append((j,l))
                  if interesting or 'nf_conntrack_in' in own[2]:
                      o.write(f'\n===== FUNCTION {own} =====\n')
                      o.write('loads ct->online_ip:\n')
                      for _i,r,b,l in entry['hits']: o.write('  '+l+'\n')
                      o.write('relevant accesses through loaded register:\n')
                      for _j,l in interesting: o.write('  '+l+'\n')
                      # Emit whole function if reasonably sized.
                      for l in block: o.write(l+'\n')

              o.write('\n===== ALL DIRECT STORES TO ONLINE_IP-COUNTER-LIKE OFFSETS IN NETFILTER RANGE =====\n')
              # Focus 0x803a0000..0x803e0000 where conntrack/BM lives.
              p=re.compile(r'\b(?:lw|sw)\s+[^,]+,(64|80|84|88|92|96|100|104|108)\(([a-z0-9]+)\)')
              for i,l in enumerate(lines):
                  a=addr_of(l)
                  if a is None or not (0x803a0000 <= a < 0x803e0000): continue
                  if p.search(l):
                      own=owner(a)
                      o.write(f'{l} owner={own}\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: run126-conntrack-onlineip-counters
          path: docs/reverse-generated/run126-conntrack-onlineip-counters.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run126-conntrack-onlineip-counters.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: trace conntrack online_ip counter updates'
            git push
          fi
