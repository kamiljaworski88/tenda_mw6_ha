name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reverse-firmware.yml'

permissions:
  contents: read

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install reverse tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3
      - name: Fetch firmware dump
        run: |
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p reports
      - name: Disassemble command transport stack
        run: |
          root='firmware-src/RootFS-unpacked'
          for f in "$root/sbin/cmdsrv" "$root/sbin/cmdcli" "$root/sbin/cmdctl_test" "$root/lib/libredis.so" "$root/lib/libcmdctl.so" "$root/lib/libcm.so" "$root/lib/libcommon.so" "$root/bin/device_list" "$root/bin/confsrv"; do
            [ -f "$f" ] || continue
            safe=$(echo "${f#$root/}" | tr '/' '_')
            file "$f" > "reports/$safe.file.txt"
            mipsel-linux-gnu-readelf -aW "$f" > "reports/$safe.readelf.txt" 2>&1 || true
            mipsel-linux-gnu-objdump -drwC "$f" > "reports/$safe.objdump.txt" 2>&1 || true
            mipsel-linux-gnu-objdump -s "$f" > "reports/$safe.sections.txt" 2>&1 || true
            strings -a -t x "$f" > "reports/$safe.strings.txt" || true
          done
      - name: Extract transport clues
        run: |
          root='firmware-src/RootFS-unpacked'
          grep -RniE 'encrypt|decrypt|cipher|crypt|base64|raw redis|without encryption|cm_io_connect|cm_io_read|cm_io_write|tcp://|redis_option|subscribe|publish|confctl_srv_key' reports > reports/transport-clues.txt || true
          find "$root" -type f -print0 | while IFS= read -r -d '' f; do
            if strings -a "$f" 2>/dev/null | grep -qiE 'without encryption|encrypted protocol|cm_io_connect'; then
              echo "===== $f =====" >> reports/transport-binary-hits.txt
              strings -a -t x "$f" | grep -iE -C 8 'without encryption|encrypted protocol|cm_io_connect' >> reports/transport-binary-hits.txt || true
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mw6-transport-reverse-reports
          path: reports/
          retention-days: 14
