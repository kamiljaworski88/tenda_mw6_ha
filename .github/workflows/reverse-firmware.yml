name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git xz-utils python3-pip
          python3 -m pip install --break-system-packages vmlinux-to-elf

      - name: Trace fastpath online_ip accounting
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated /tmp/mw6kernel
          img='firmware-src/image-unpacked-as-per-mtd/30_KernelFS'
          raw='/tmp/mw6kernel/kernel.raw'
          elf='/tmp/mw6kernel/kernel.elf'
          out='docs/reverse-generated/run128-fastpath-onlineip-accounting.txt'

          dd if="$img" of=/tmp/mw6kernel/kernel.lzma bs=1 skip=$((0x2818)) status=none
          xz --format=lzma -dc /tmp/mw6kernel/kernel.lzma > "$raw" || true
          test -s "$raw"
          vmlinux-to-elf "$raw" "$elf" >/tmp/mw6kernel/v2e.log 2>&1

          {
            echo '===== RUN 128: fastpath / Realtek conntrack online_ip accounting ====='
            echo
            echo '===== RTL CONNTRACK HOOK WRAPPERS ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x804646c0 --stop-address=0x80464940 "$elf" || true
            echo
            echo '===== FASTPATH PREROUTING HOOK ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x80389640 --stop-address=0x80389940 "$elf" || true
            echo
            echo '===== FASTPATH ENTER / ROUTE REGION ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x80454f80 --stop-address=0x8045a700 "$elf" || true
            echo
            echo '===== HW NAT IP CHECK ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x801cc900 --stop-address=0x801ccb80 "$elf" || true
            echo
            echo '===== SYMBOLS NEAR FASTPATH / HOOKS ====='
            mipsel-linux-gnu-nm -n "$elf" | grep -Ei 'fastpath|fast_nat|hw_nat|rtl_nf_conntrack|rtl865x_check_hw_nat|online_ip|traffic|statistic' | head -n 1200 || true
          } > "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: run128-fastpath-onlineip-accounting
          path: docs/reverse-generated/run128-fastpath-onlineip-accounting.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run128-fastpath-onlineip-accounting.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: trace fastpath online_ip accounting'
            git push
          fi
