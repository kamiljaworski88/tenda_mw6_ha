name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git xz-utils python3-pip
          python3 -m pip install --break-system-packages vmlinux-to-elf

      - name: Trace NOS/TBQ packet hooks versus FastPath
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated /tmp/mw6kernel
          img='firmware-src/image-unpacked-as-per-mtd/30_KernelFS'
          raw='/tmp/mw6kernel/kernel.raw'
          elf='/tmp/mw6kernel/kernel.elf'
          nos='firmware-src/RootFS-unpacked/lib/modules/nos.ko'
          out='docs/reverse-generated/run143-nos-fastpath-hooks.txt'

          dd if="$img" of=/tmp/mw6kernel/kernel.lzma bs=1 skip=$((0x2818)) status=none
          xz --format=lzma -dc /tmp/mw6kernel/kernel.lzma > "$raw" || true
          test -s "$raw"
          vmlinux-to-elf "$raw" "$elf" >/tmp/mw6kernel/v2e.log 2>&1

          python3 - "$elf" "$nos" "$out" <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          kernel=Path(sys.argv[1]); nos=Path(sys.argv[2]); out=Path(sys.argv[3])

          def run(cmd):
              return subprocess.run(cmd,text=True,errors='replace',
                                    stdout=subprocess.PIPE,stderr=subprocess.STDOUT).stdout

          def syms(path, dynamic=False):
              args=["mipsel-linux-gnu-nm"]
              if dynamic: args.append("-D")
              args += ["-n",str(path)]
              arr=[]
              for l in run(args).splitlines():
                  p=l.split(maxsplit=2)
                  if len(p)==3:
                      try:a=int(p[0],16)
                      except:continue
                      arr.append((a,p[1],p[2]))
              return sorted(arr)

          def dump_named(path, table, name, maxspan=0x2400):
              ms=[x for x in table if x[2]==name]
              if not ms:
                  return f"===== {name}: NOT FOUND in {path.name} =====\n"
              a,t,n=ms[0]; stop=a+maxspan
              for aa,tt,nn in table:
                  if aa>a:
                      stop=min(stop,aa); break
              return f"===== {path.name}:{name} @ 0x{a:x} =====\n"+run([
                  "mipsel-linux-gnu-objdump","-drwC",
                  f"--start-address=0x{a:x}",f"--stop-address=0x{stop:x}",str(path)])

          ksyms=syms(kernel)
          nsyms=syms(nos)

          kdis=run(["mipsel-linux-gnu-objdump","-drwC",str(kernel)])
          ndis=run(["mipsel-linux-gnu-objdump","-drwC",str(nos)])
          nrel=run(["mipsel-linux-gnu-objdump","-r",str(nos)])

          with out.open("w",encoding="utf-8") as o:
              o.write("===== RUN 143: NOS/TBQ hooks vs Realtek FastPath =====\n\n")

              o.write("===== KERNEL NOS-RELATED SYMBOLS =====\n")
              for a,t,n in ksyms:
                  if re.search(r'nos|tbq|track_event|online_ip|fastpath|FastPath|hwnat|hw_nat',n,re.I):
                      o.write(f"0x{a:08x} {t} {n}\n")

              o.write("\n===== NOS MODULE SYMBOLS 0x5600..0x6600 =====\n")
              for a,t,n in nsyms:
                  if 0x5600 <= a <= 0x6600:
                      o.write(f"0x{a:08x} {t} {n}\n")

              for n in [
                  "nos_tbq_init","nos_tbq_fini",
                  "tbq_global_init","tbq_global_cleanup",
                  "tbq_timer_init","tbq_timer_cleanup",
                  "tbq_enqueue","tbq_filter_packet_by_nf_conn",
                  "tbq_timer_func"
              ]:
                  o.write("\n"+dump_named(nos,nsyms,n))

              for n in [
                  "nos_tbq_enqueue",
                  "nos_track_event_register",
                  "nos_track_event_unregister",
                  "FastPath_Enter",
                  "enter_fast_path",
                  "fastpath_xmit_prerouting_hook",
                  "rtl_nf_conntrack_in_hooks",
                  "nf_conntrack_in"
              ]:
                  o.write("\n"+dump_named(kernel,ksyms,n))

              o.write("\n===== NOS RELOCATIONS TO KERNEL HOOKS =====\n")
              for l in nrel.splitlines():
                  if re.search(r'nos_|track_event|tbq|online_ip|netfilter|hook|conntrack',l,re.I):
                      o.write(l+"\n")

              o.write("\n===== NOS DISASSEMBLY AROUND EXTERNAL nos_tbq_enqueue REFERENCES =====\n")
              nlines=ndis.splitlines()
              for i,l in enumerate(nlines):
                  if "nos_tbq_enqueue" in l:
                      o.write("\n".join(nlines[max(0,i-24):min(len(nlines),i+36)])+"\n---\n")

              o.write("\n===== KERNEL DISASSEMBLY AROUND NOS/TBQ SYMBOL REFERENCES =====\n")
              klines=kdis.splitlines()
              for i,l in enumerate(klines):
                  if re.search(r'<(?:nos_tbq_enqueue|nos_track_event_register|nos_track_event_unregister)>',l):
                      o.write("\n".join(klines[max(0,i-28):min(len(klines),i+50)])+"\n---\n")

              o.write("\n===== FASTPATH FUNCTIONS WITH CALLS/HOOKS =====\n")
              # High-value full-ish functions and any lines mentioning hook-style globals.
              for marker in ["FastPath_Enter","enter_fast_path","rtl_netif_receive_skb_hooks"]:
                  ms=[x for x in ksyms if x[2]==marker]
                  if ms:
                      a=ms[0][0]
                      o.write(dump_named(kernel,ksyms,marker,0x5000)+"\n")

              o.write("\n===== KERNEL STRINGS CONTAINING NOS/TBQ/FASTPATH =====\n")
              st=run(["strings","-tx",str(kernel)])
              for l in st.splitlines():
                  if re.search(r'nos|tbq|fastpath|fast path|hw_nat|hwnat',l,re.I):
                      o.write(l+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: run143-nos-fastpath-hooks
          path: docs/reverse-generated/run143-nos-fastpath-hooks.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run143-nos-fastpath-hooks.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: trace NOS hooks through FastPath'
            git push
          fi
