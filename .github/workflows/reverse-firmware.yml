name: Reverse MW6 firmware
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git
      - name: Resolve timer_start semantics
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
          lib='firmware-src/RootFS-unpacked/lib/libcommon.so'
          dev='firmware-src/RootFS-unpacked/bin/device_list'
          out='docs/reverse-generated/run165-timer-start-semantics.txt'
          {
            echo '===== RUN 165: libcommon timer_start semantics ====='
            echo
            echo '===== timer_start / timer_stop / timer worker symbols ====='
            mipsel-linux-gnu-nm -D -n "$lib" | grep -Ei 'timer_(start|stop|check|init|process|add|del)|timer' || true
            echo
            echo '===== timer_start body ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x39b00 --stop-address=0x3a500 "$lib"
            echo
            echo '===== device_list timer start/restart area ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x403900 --stop-address=0x403d00 "$dev"
            echo
            echo '===== device_list callback table tail ====='
            mipsel-linux-gnu-objdump -s --start-address=0x420000 --stop-address=0x420900 "$dev" || true
            echo
            echo '===== timer strings ====='
            strings -tx "$lib" | grep -Ei 'timer|interval|timeout|repeat|period' || true
          } > "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: run165-timer-start-semantics
          path: docs/reverse-generated/run165-timer-start-semantics.txt
          retention-days: 7
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run165-timer-start-semantics.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: resolve timer_start semantics'
            git push
          fi
