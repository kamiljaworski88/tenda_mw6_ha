name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reverse-firmware.yml'
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3-pip
          python3 -m pip install --break-system-packages pyelftools
      - run: |
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
      - name: Recover GetHostList command table
        run: |
          cat > /tmp/recover.py <<'PY'
          from elftools.elf.elffile import ELFFile
          import struct
          p='firmware-src/RootFS-unpacked/bin/confsrv'
          with open(p,'rb') as f:
            e=ELFFile(f); secs=[]
            for s in e.iter_sections():
              if s['sh_flags'] & 2 and s['sh_size']: secs.append((s.name,s['sh_addr'],s.data()))
            def cstr(a):
              for n,b,d in secs:
                if b<=a<b+len(d):
                  o=a-b; z=d.find(b'\0',o)
                  if z<0:z=min(len(d),o+64)
                  x=d[o:z]
                  if x and all(32<=q<127 for q in x): return x.decode()
            def u32(a):
              for n,b,d in secs:
                if b<=a<=b+len(d)-4:return struct.unpack_from('<I',d,a-b)[0]
            # GetHostList string VA is file-string offset 0x67a30 mapped in .rodata; find it by content.
            sva=None
            for n,b,d in secs:
              i=d.find(b'GetHostList\0')
              if i>=0:sva=b+i;break
            print(f'GetHostList string VA={sva:#x}')
            # Locate pointer to the string in all allocated data; print broad table neighborhood.
            needle=struct.pack('<I',sva)
            for n,b,d in secs:
              pos=0
              while True:
                i=d.find(needle,pos)
                if i<0:break
                va=b+i; print(f'\nPOINTER in {n} at {va:#x}')
                for a in range(va-128,va+160,4):
                  v=u32(a)
                  if v is None:continue
                  s=cstr(v); note=f' -> {s!r}' if s else ''
                  print(f'{a:#010x} {v:#010x}{note}')
                pos=i+1
          PY
          python3 /tmp/recover.py > docs/reverse-generated/gethostlist-command-table.txt
          root='firmware-src/RootFS-unpacked'
          {
            echo '\n===== init and open references ====='
            mipsel-linux-gnu-objdump -drwC "$root/bin/confsrv" | grep -n -B120 -A220 -E 'conf_msg_open|conf_msg_all_cmds_init|conf_msg_define|confctl_get_host_list' || true
            echo '\n===== cmd_get internals ====='
            mipsel-linux-gnu-objdump -drwC --disassemble=cmd_get "$root/lib/libcmdctl.so" || true
            mipsel-linux-gnu-objdump -drwC "$root/lib/libcmdctl.so" | grep -n -B120 -A260 -E 'cmd_get_done|cmdsh_random_key|publish|subscribe' || true
          } >> docs/reverse-generated/gethostlist-command-table.txt
          head -c 950000 docs/reverse-generated/gethostlist-command-table.txt > /tmp/o && mv /tmp/o docs/reverse-generated/gethostlist-command-table.txt
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/gethostlist-command-table.txt
          if ! git diff --cached --quiet; then git commit -m 'reverse: refresh GetHostList command table'; git push; fi
