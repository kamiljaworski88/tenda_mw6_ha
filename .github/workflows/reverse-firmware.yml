name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install reverse-engineering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3-pip
          python3 -m pip install --break-system-packages pyelftools

      - name: Locate every caller of dev traffic send API
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
          out='docs/reverse-generated/dev-traffic-send-callers.txt'

          python3 - "$out" <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          import re
          import struct
          import subprocess
          import sys

          root = Path('firmware-src/RootFS-unpacked')
          out_path = Path(sys.argv[1])
          target_name = 'uc_api_m_cloud_info_send_dev_traffic'

          def is_elf(path):
              try:
                  with path.open('rb') as fh:
                      return fh.read(4) == b'\x7fELF'
              except OSError:
                  return False

          def disassemble(path):
              return subprocess.check_output(
                  ['mipsel-linux-gnu-objdump', '-drwC', str(path)],
                  text=True,
                  errors='replace',
              ).splitlines()

          def current_function(lines, idx):
              for j in range(idx, -1, -1):
                  m = re.match(r'^([0-9a-fA-F]+) <([^>]+)>:', lines[j])
                  if m:
                      return int(m.group(1), 16), m.group(2)
              return None, '<unknown>'

          hits = []
          for path in root.rglob('*'):
              if not path.is_file() or not is_elf(path):
                  continue
              try:
                  with path.open('rb') as fh:
                      elf = ELFFile(fh)
                      dynsym = elf.get_section_by_name('.dynsym')
                      if dynsym is None:
                          continue
                      for sym in dynsym.iter_symbols():
                          if sym.name == target_name:
                              hits.append((path, int(sym['st_value']), sym['st_shndx']))
              except Exception:
                  continue

          with out_path.open('w', encoding='utf-8') as out:
              out.write('===== RUN 116 GOAL =====\n')
              out.write('Locate every ELF importing/defining uc_api_m_cloud_info_send_dev_traffic and recover caller functions.\n')
              out.write(f'ELF symbol hits: {len(hits)}\n')

              for path, value, shndx in hits:
                  out.write(f'\n===== {path} =====\n')
                  out.write(f'{target_name} value=0x{value:x} shndx={shndx}\n')
                  lines = disassemble(path)

                  with path.open('rb') as fh:
                      elf = ELFFile(fh)
                      got = elf.get_section_by_name('.got')
                      if got is None:
                          out.write('NO .got\n')
                          continue
                      got_base = int(got['sh_addr'])
                      gp = got_base + 0x7ff0
                      data = got.data()

                  got_entries = []
                  if value:
                      for off in range(0, len(data) - 3, 4):
                          word = struct.unpack_from('<I', data, off)[0]
                          if word == value:
                              addr = got_base + off
                              got_entries.append((addr, addr - gp))

                  out.write(f'.got=0x{got_base:x} inferred_gp=0x{gp:x}\n')
                  if not got_entries:
                      out.write('NO GOT WORD MATCHING SYMBOL VALUE\n')

                  for addr, gp_off in got_entries:
                      out.write(f'GOT=0x{addr:x} gp_off={gp_off}\n')
                      pat = re.compile(r'\b(?:lw|addiu)\s+\w+,' + re.escape(str(gp_off)) + r'\(gp\)')
                      found = []
                      for i, line in enumerate(lines):
                          if pat.search(line):
                              found.append(i)
                      if not found:
                          out.write('  NO CODE XREF\n')
                      for i in found:
                          fn_addr, fn_name = current_function(lines, i)
                          out.write(f'  XREF {fn_name} @ {fn_addr and hex(fn_addr)} line={i+1}\n')
                          for row in lines[max(0, i-18):min(len(lines), i+30)]:
                              out.write('    ' + row + '\n')

              out.write('\n===== STRING-ONLY REFERENCES ACROSS ROOTFS =====\n')
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  try:
                      data = path.read_bytes()
                  except OSError:
                      continue
                  if target_name.encode() in data and not any(path == h[0] for h in hits):
                      out.write(str(path) + '\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dev-traffic-send-callers
          path: docs/reverse-generated/dev-traffic-send-callers.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/dev-traffic-send-callers.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: locate dev traffic send callers'
            git push || true
          fi
