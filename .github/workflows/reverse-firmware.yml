name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reverse-firmware.yml'

permissions:
  contents: read

jobs:
  disassemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu git
      - name: Fetch public MW6 HW2.1 firmware dump
        run: |
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p reports
      - name: Locate rate-related firmware objects
        run: |
          root='firmware-src/RootFS-unpacked'
          {
            echo '=== filenames ==='
            find "$root" -type f \( -iname '*cloud*' -o -iname '*online*' -o -iname '*bm_*' -o -iname '*band*' -o -iname '*rate*' \) -print
            echo
            echo '=== text references ==='
            grep -RInaE 'fill_cloud_info_device_lists_rate|g_ip_info|online_ip|bm_online_ip|device_lists_rate' "$root" firmware-src/boot.log firmware-src/README*.md 2>/dev/null || true
          } > reports/rate-locate.txt

          # Search every regular ELF/library/module for embedded strings without assuming a path.
          : > reports/rate-binary-hits.txt
          while IFS= read -r -d '' f; do
            if strings -a "$f" 2>/dev/null | grep -qE 'fill_cloud_info_device_lists_rate|g_ip_info|online_ip|bm_online_ip|device_lists_rate'; then
              echo "===== $f =====" >> reports/rate-binary-hits.txt
              strings -a -t x "$f" | grep -E -C 12 'fill_cloud_info_device_lists_rate|g_ip_info|online_ip|bm_online_ip|device_lists_rate' >> reports/rate-binary-hits.txt || true
            fi
          done < <(find "$root" -type f -print0)
      - name: Disassemble binaries containing rate symbols
        run: |
          root='firmware-src/RootFS-unpacked'
          mkdir -p reports/rate-elf
          while IFS= read -r -d '' f; do
            if strings -a "$f" 2>/dev/null | grep -qE 'fill_cloud_info_device_lists_rate|g_ip_info|online_ip|bm_online_ip|device_lists_rate'; then
              rel=${f#"$root/"}
              safe=$(echo "$rel" | tr '/' '_')
              file "$f" > "reports/rate-elf/$safe.file.txt" || true
              mips-linux-gnu-readelf -aW "$f" > "reports/rate-elf/$safe.readelf.txt" 2>&1 || true
              mips-linux-gnu-objdump -drwC "$f" > "reports/rate-elf/$safe.objdump.txt" 2>&1 || true
              strings -a -t x "$f" > "reports/rate-elf/$safe.strings.txt" || true
            fi
          done < <(find "$root" -type f -print0)
      - name: Extract neighborhoods around rate strings and likely proc paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          keys=('fill_cloud_info_device_lists_rate','g_ip_info','online_ip','bm_online_ip','/proc/','rate','speed','upload','download')
          out=[]
          for p in Path('reports/rate-elf').glob('*.strings.txt'):
              lines=p.read_text(errors='replace').splitlines()
              hits=[]
              for i,line in enumerate(lines):
                  if any(k.lower() in line.lower() for k in keys):
                      hits.extend(lines[max(0,i-10):min(len(lines),i+11)])
                      hits.append('-'*80)
              if hits:
                  out.append(f'===== {p.name} =====')
                  out.extend(hits)
          Path('reports/rate-string-neighborhoods.txt').write_text('\n'.join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mw6-rate-reverse-reports
          path: reports/
          retention-days: 14
