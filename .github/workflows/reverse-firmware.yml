name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git

      - name: Map HostInfo online field
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated
          conf='firmware-src/RootFS-unpacked/bin/confsrv'
          out='docs/reverse-generated/run148-hostinfo-online-field-map.txt'

          {
            echo '===== RUN 148: HostInfo online field map ====='
            echo 'Known call targets from confctl_get_host_list:'
            echo '  0x433e3c = fill_host_lists_info candidate (HostLists*, client_array, count)'
            echo '  0x434258 = fill_host_lists_rate'
            echo

            echo '===== DISASSEMBLY 0x433700..0x434258 ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x433700 --stop-address=0x434258 "$conf"

            echo
            echo '===== RATE HELPER HEAD 0x434258..0x434380 ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x434258 --stop-address=0x434380 "$conf"

            echo
            echo '===== GOT ====='
            mipsel-linux-gnu-readelf -A "$conf"

            echo
            echo '===== IMPORTED HOST/PROTOBUF SYMBOLS ====='
            mipsel-linux-gnu-readelf -Ws "$conf" | grep -Ei 'host_info|host_lists|strdup|malloc|memcpy|strcmp|strlen|inet|ethaddr' || true

            echo
            echo '===== LOCAL FUNCTION PROLOGUE CANDIDATES 0x433700..0x434258 ====='
            mipsel-linux-gnu-objdump -drwC --start-address=0x433700 --stop-address=0x434258 "$conf" |
              grep -B2 -A8 -E 'addiu[[:space:]]+sp,sp,-|lui[[:space:]]+gp,' || true
          } > "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: run148-hostinfo-online-field-map
          path: docs/reverse-generated/run148-hostinfo-online-field-map.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run148-hostinfo-online-field-map.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: map HostInfo online field'
            git push
          fi
