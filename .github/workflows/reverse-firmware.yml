name: Reverse MW6 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reverse-firmware.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu git python3-pip
          python3 -m pip install --break-system-packages pyelftools

      - name: Resolve HostInfo descriptor and online writers
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/latonita/tenda-reverse.git firmware-src
          mkdir -p docs/reverse-generated /tmp/run149
          pb='firmware-src/RootFS-unpacked/lib/libpb.so'
          conf='firmware-src/RootFS-unpacked/bin/confsrv'
          out='docs/reverse-generated/run149-hostinfo-online-exact.txt'
          mipsel-linux-gnu-objdump -drwC "$conf" > /tmp/run149/confsrv.dis

          python3 - "$pb" "$conf" /tmp/run149/confsrv.dis "$out" <<'PY'
          import re, struct, subprocess, sys
          from pathlib import Path
          from elftools.elf.elffile import ELFFile

          pb=Path(sys.argv[1]); conf=Path(sys.argv[2])
          dis=Path(sys.argv[3]).read_text(errors='replace').splitlines()
          out=Path(sys.argv[4])

          def run(cmd):
              return subprocess.run(cmd,text=True,errors='replace',
                                    stdout=subprocess.PIPE,stderr=subprocess.STDOUT).stdout

          def find_sym(path, name):
              txt=run(["mipsel-linux-gnu-readelf","-Ws",str(path)])
              for l in txt.splitlines():
                  p=l.split()
                  if len(p)>=8 and p[-1]==name:
                      return int(p[1],16), int(p[2])
              return None,None

          class ELFReader:
              def __init__(self,path):
                  self.f=path.open('rb'); self.ef=ELFFile(self.f)
              def read(self,addr,n):
                  for sec in self.ef.iter_sections():
                      a=int(sec['sh_addr']); z=int(sec['sh_size'])
                      if a <= addr and addr+n <= a+z:
                          off=addr-a
                          return sec.data()[off:off+n]
                  raise KeyError(f'VA 0x{addr:x}+{n} not mapped')
              def u32(self,addr):
                  return struct.unpack('<I',self.read(addr,4))[0]
              def cstr(self,addr,maxn=256):
                  if not addr:return ''
                  b=bytearray()
                  for i in range(maxn):
                      x=self.read(addr+i,1)[0]
                      if x==0:break
                      b.append(x)
                  return b.decode('utf-8','replace')
              def close(self): self.f.close()

          r=ELFReader(pb)
          desc_addr,desc_size=find_sym(pb,'host_info__descriptor')
          if desc_addr is None:
              raise SystemExit('host_info__descriptor not found')

          # protobuf-c 1.1.x, 32-bit:
          # MessageDescriptor: magic,name,short_name,c_name,package_name,
          # sizeof_message,n_fields,fields,...
          words=[r.u32(desc_addr+4*i) for i in range(14)]
          sizeof_message=words[5]
          n_fields=words[6]
          fields_addr=words[7]

          # ProtobufCFieldDescriptor 32-bit is 48 bytes:
          # name,id,label,type,quantifier_offset,offset,descriptor,default,
          # flags,reserved_flags,reserved2,reserved3
          fields=[]
          for i in range(n_fields):
              a=fields_addr+i*48
              w=[r.u32(a+4*j) for j in range(12)]
              fields.append({
                'index':i,'addr':a,'name':r.cstr(w[0]),'id':w[1],
                'label':w[2],'type':w[3],'quantifier_offset':w[4],
                'offset':w[5],'flags':w[8]
              })

          # host_info__init copies a 56-byte static template. Find pointer from
          # disassembly of host_info__init and dump all words for cross-check.
          init_addr,_=find_sym(pb,'host_info__init')
          pbdis=run(["mipsel-linux-gnu-objdump","-drwC",
                     f"--start-address=0x{init_addr:x}",
                     f"--stop-address=0x{init_addr+0x80:x}",str(pb)])

          # Parse confsrv functions by prologue heuristic because local symbols
          # are stripped. This is enough to group +132 writes.
          starts=[]
          for i,l in enumerate(dis):
              m=re.match(r'^\s*([0-9a-fA-F]+):',l)
              if not m: continue
              if 'lui\tgp,' in l or re.search(r'\blui\s+gp,',l):
                  # Typical PIC function starts with lui gp.
                  addr=int(m.group(1),16)
                  starts.append((i,addr))
          starts=sorted(set(starts))

          def owner(idx):
              prev=None
              for st,a in starts:
                  if st>idx:break
                  prev=(st,a)
              return prev

          writes=[]
          for i,l in enumerate(dis):
              # Byte/word writes to offset 132, the source field copied into HostInfo.
              if re.search(r'\b(?:sb|sh|sw)\s+[^,]+,132\([^)]+\)',l,re.I):
                  ow=owner(i)
                  lo=max(0,i-24); hi=min(len(dis),i+34)
                  writes.append((ow,i,dis[lo:hi]))

          # Also collect reads at +132 near the exact mapper.
          mapper=[]
          inmap=False
          for i,l in enumerate(dis):
              if re.match(r'^\s*433ab4:',l): inmap=True
              if inmap: mapper.append(l)
              if inmap and re.match(r'^\s*433e3c:',l):
                  mapper.pop(); break

          # Search string VAs and xref clues for offline/status function names.
          raw=conf.read_bytes()
          names=[
              b'fill_host_info_from_client_status',
              b'device_client_offline_check',
              b'update_client_info_to_hash_table',
              b'add_new_client_to_hash_table',
              b'upload_client_online_status_change'
          ]
          str_hits=[]
          with conf.open('rb') as f:
              ef=ELFFile(f)
              for name in names:
                  off=raw.find(name)
                  va=None
                  if off>=0:
                      for sec in ef.iter_sections():
                          so=int(sec['sh_offset']); sz=int(sec['sh_size'])
                          if so<=off<so+sz:
                              va=int(sec['sh_addr'])+(off-so); break
                  str_hits.append((name.decode(),off,va))

          with out.open('w',encoding='utf-8') as o:
              o.write('===== RUN 149: exact HostInfo layout and online source =====\n\n')
              o.write(f'host_info__descriptor = 0x{desc_addr:x} size={desc_size}\n')
              o.write(f'sizeof_message = {sizeof_message} bytes\n')
              o.write(f'n_fields = {n_fields}\n')
              o.write(f'fields descriptor = 0x{fields_addr:x}\n\n')

              o.write('===== HOSTINFO FIELD DESCRIPTOR OFFSETS =====\n')
              for f in fields:
                  o.write(
                    f"id={f['id']:2d} name={f['name']:<16} "
                    f"offset=0x{f['offset']:02x} quantifier=0x{f['quantifier_offset']:02x} "
                    f"label={f['label']} type={f['type']} flags=0x{f['flags']:x}\n"
                  )

              o.write('\n===== host_info__init =====\n')
              o.write(pbdis+'\n')

              o.write('\n===== EXACT 0x433ab4 MAPPER =====\n')
              o.write('\n'.join(mapper)+'\n')

              o.write('\n===== WRITES TO CLIENT STATUS OFFSET +0x84 (132) =====\n')
              if not writes:o.write('NO WRITES FOUND\n')
              for ow,i,ctx in writes:
                  if ow:o.write(f"\n--- candidate function start 0x{ow[1]:08x} ---\n")
                  else:o.write('\n--- owner unknown ---\n')
                  o.write('\n'.join(ctx)+'\n')

              o.write('\n===== FUNCTION-NAME STRING ADDRESSES =====\n')
              for n,off,va in str_hits:
                  o.write(f'{n}: file_off={off:#x} va={("0x%x"%va) if va else "?"}\n')

              o.write('\n===== CONCLUSION INPUTS =====\n')
              online=[f for f in fields if f['name']=='online']
              if online:
                  o.write(f"descriptor online offset = 0x{online[0]['offset']:x}\n")
              o.write('mapper source byte candidate = client_status+0x84\n')
          r.close()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: run149-hostinfo-online-exact
          path: docs/reverse-generated/run149-hostinfo-online-exact.txt
          retention-days: 7

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-generated/run149-hostinfo-online-exact.txt
          if ! git diff --cached --quiet; then
            git commit -m 'reverse: resolve exact HostInfo online source'
            git push
          fi
